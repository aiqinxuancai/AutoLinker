<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
	margin: 0;
	padding: 0;
	background: #e6e9ef;
	color: #4c4f69;
	font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

body {
	padding: 0;
}

html:not(.autolinker-page-visible) *,
html:not(.autolinker-page-visible) *::before,
html:not(.autolinker-page-visible) *::after {
	animation-play-state: paused !important;
}

.layout {
	display: flex;
	flex-direction: column;
	height: 100vh;
	box-sizing: border-box;
	position: relative;
}

.topbar {
	flex: 0 0 36px;
	height: 36px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	background: #e6e9ef;
	padding: 0 10px 0 12px;
	box-sizing: border-box;
	position: relative;
}

.topbar-brand {
	color: #8839ef;
	font-size: 13px;
	font-weight: 300;
	line-height: 1;
	letter-spacing: 0;
	text-transform: uppercase;
	white-space: nowrap;
	cursor: pointer;
}

.topbar-left {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
}

.update-tag {
	display: inline-flex;
	align-items: center;
	height: 16px;
	padding: 0 7px;
	border-radius: 5px;
	background: linear-gradient(110deg, #8839ef, #1e66f5);
	color: #fff;
	font-size: 10px;
	font-weight: 700;
	letter-spacing: .6px;
	line-height: 1;
	text-decoration: none;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 4px rgba(136, 57, 239, .35);
	animation: update-tag-pulse 1.9s ease-in-out infinite;
}

.update-tag[hidden] {
	display: none;
}

.update-tag:hover {
	filter: brightness(1.08);
}

@keyframes update-tag-pulse {
	0%, 100% { box-shadow: 0 1px 4px rgba(136, 57, 239, .35); }
	50% { box-shadow: 0 1px 9px rgba(30, 102, 245, .58); }
}

.topbar-actions {
	display: flex;
	align-items: center;
	gap: 8px;
}

.top-action {
	width: 24px;
	height: 24px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	border-radius: 0;
	background: transparent;
	color: #4c4f69;
	padding: 0;
	cursor: pointer;
}

.top-action:hover {
	color: #0b63c9;
}

.top-action.active {
	color: #1e66f5;
	background: #dce9ff;
	border-radius: 6px;
}

.top-action:focus-visible {
	outline: 1px solid #4c4f69;
	outline-offset: 2px;
}

.top-action:disabled {
	opacity: .45;
	cursor: default;
}

.top-action svg {
	width: 14px;
	height: 14px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.25;
	stroke-linecap: round;
	stroke-linejoin: round;
	pointer-events: none;
}

.top-action.mcp-action {
	width: 36px;
	font-size: 10px;
	font-weight: 700;
	letter-spacing: 0;
}

.history-pane {
	flex: 1 1 auto;
	min-height: 0;
	position: relative;
	overflow: hidden;
	background: #e6e9ef;
}

.history {
	width: 100%;
	height: 100%;
	overflow: auto;
	padding: 0;
	box-sizing: border-box;
	background: #e6e9ef;
	font-size: 12px;
	color: #4c4f69;
}

.latest-user-float {
	position: absolute;
	top: 8px;
	left: 20px;
	right: 20px;
	z-index: 4;
	padding: 4px 9px;
	border: 1px solid #d7dbe3;
	border-radius: 6px;
	background: #eff1f5;
	box-shadow: 0 2px 8px rgba(30, 38, 58, .12);
	box-sizing: border-box;
	color: #4c4f69;
	font-size: 11px;
	line-height: 16px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	pointer-events: none;
}

.latest-user-float[hidden] {
	display: none;
}

#chat-root {
	min-height: 100%;
	background: #e6e9ef;
	display: flex;
	flex-direction: column;
}

.composer {
	flex: 0 0 auto;
	border-top: 1px solid #d7dbe3;
	background: #e6e9ef;
	padding: 8px 12px 10px;
	box-sizing: border-box;
	position: relative;
}

.composer-surface {
	position: relative;
	border: 1px solid #d4d9e3;
	border-radius: 7px;
	background: #fff;
	box-shadow: 0 1px 2px rgba(76, 79, 105, .06);
	transition: border-color .15s ease, box-shadow .15s ease;
}

.composer-surface:focus-within {
	border-color: #1e66f5;
	box-shadow: 0 0 0 2px rgba(30, 102, 245, .1);
}

.composer-toolbar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	min-height: 36px;
	gap: 10px;
	padding: 3px 6px;
	border-top: 1px solid #e1e5ec;
	box-sizing: border-box;
}

.composer-toolbar-left,
.composer-toolbar-right {
	display: flex;
	align-items: center;
	gap: 5px;
	min-width: 0;
}

.composer-toolbar-left {
	flex: 1 1 auto;
}

.composer-toolbar-right {
	flex: 0 0 auto;
	margin-left: auto;
}

.session-status[hidden] {
	display: none;
}

.session-status {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 4px;
	height: 28px;
	padding: 0 4px;
	border: 0;
	background: transparent;
	color: #7b8190;
	font: 600 10px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
	box-sizing: border-box;
}

.session-status svg {
	width: 13px;
	height: 13px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.7;
	stroke-linecap: round;
	stroke-linejoin: round;
}

.session-status.working {
	color: #1e66f5;
}

.session-status.done {
	color: #7b8190;
}

.input-wrap {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

.empty-state {
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 24px;
	padding: 28px 20px;
	box-sizing: border-box;
	text-align: center;
}

.empty-state-title {
	font-size: 34px;
	font-weight: 800;
	letter-spacing: 3px;
	line-height: 1.25;
	background: linear-gradient(110deg, #8839ef 0%, #1e66f5 42%, #04a5e5 78%, #8839ef 100%);
	background-size: 220% auto;
	-webkit-background-clip: text;
	background-clip: text;
	-webkit-text-fill-color: transparent;
	color: transparent;
	filter: drop-shadow(0 2px 12px rgba(136, 57, 239, .26));
	animation: empty-state-flow 7s ease-in-out infinite;
	user-select: none;
}

@keyframes empty-state-flow {
	0% { background-position: 0% center; }
	50% { background-position: 100% center; }
	100% { background-position: 0% center; }
}

.empty-state-links {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
}

.empty-state-news {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 8px;
	width: min(620px, 100%);
}

.news-config-text {
	width: 100%;
	max-width: 620px;
	padding: 9px 14px;
	border: 1px solid rgba(76, 79, 105, .18);
	border-radius: 6px;
	background: rgba(239, 241, 245, .72);
	color: #4c4f69;
	font-size: 13px;
	line-height: 1.5;
	text-align: left;
	white-space: pre-wrap;
}

.news-config-text-title {
	margin-bottom: 3px;
	color: #1e66f5;
	font-weight: 700;
}

.empty-state-links a {
	display: inline-block;
	font-size: 13px;
	line-height: 1.2;
	color: #1e66f5;
	text-decoration: none;
	padding: 8px 18px;
	border: 1px solid rgba(30, 102, 245, .26);
	border-radius: 6px;
	background: rgba(30, 102, 245, .06);
	transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
	cursor: pointer;
}

.empty-state-links a:hover {
	color: #fff;
	background: #1e66f5;
	border-color: #1e66f5;
	box-shadow: 0 6px 16px rgba(30, 102, 245, .26);
}

.input-area {
	position: relative;
}

.attachment-strip {
	display: flex;
	align-items: stretch;
	gap: 8px;
	margin-bottom: 8px;
	overflow-x: auto;
	padding: 1px 1px 4px;
}

.attachment-strip[hidden] { display: none; }

.attachment-item {
	position: relative;
	flex: 0 0 128px;
	height: 58px;
	display: grid;
	grid-template-columns: 48px minmax(0, 1fr);
	align-items: center;
	gap: 8px;
	padding: 5px;
	border: 1px solid var(--al-soft-border, #d4d9e3);
	border-radius: 6px;
	background: var(--al-input-bg, #fff);
	box-sizing: border-box;
}

.attachment-thumb {
	width: 48px;
	height: 46px;
	object-fit: cover;
	border-radius: 4px;
	background: var(--al-panel-bg, #eef1f6);
}

.attachment-meta { min-width: 0; padding-right: 14px; }
.attachment-name {
	font-size: 10px;
	line-height: 1.35;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.attachment-size { color: var(--al-subtle-text, #8c8fa1); font-size: 9px; }

.attachment-remove {
	position: absolute;
	top: 3px;
	right: 3px;
	width: 18px;
	height: 18px;
	border: 0;
	padding: 0;
	background: rgba(255, 255, 255, .88);
	color: var(--al-danger, #d20f39);
	font: 15px/17px "Segoe UI", sans-serif;
	cursor: pointer;
}

.attach-icon-btn {
	width: 28px;
	height: 28px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	border-radius: 6px;
	background: transparent;
	color: var(--al-subtle-text, #6c7086);
	padding: 0;
	cursor: pointer;
	transition: color .15s ease, background-color .15s ease;
}
.attach-icon-btn:hover {
	color: var(--al-primary, #1e66f5);
	background: var(--al-button-hover-bg, #eef1f6);
}
.attach-icon-btn:focus-visible {
	outline: 2px solid rgba(30, 102, 245, .35);
	outline-offset: 2px;
}
.attach-icon-btn:disabled { opacity: .45; cursor: default; }
.attach-icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

.drop-overlay {
	position: absolute;
	inset: 6px;
	z-index: 30;
	display: flex;
	align-items: center;
	justify-content: center;
	border: 2px dashed var(--al-primary, #1e66f5);
	border-radius: 6px;
	background: color-mix(in srgb, var(--al-composer-bg, #e6e9ef) 90%, transparent);
	color: var(--al-primary, #1e66f5);
	font-size: 12px;
	font-weight: 700;
	pointer-events: none;
}
.drop-overlay[hidden] { display: none; }

.pending-inputs {
	margin: 0 0 8px;
	padding: 8px 10px;
	border: 1px solid #d4d9e3;
	border-radius: 6px;
	background: rgba(255, 255, 255, .55);
	font: 12px/1.45 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.pending-inputs[hidden] { display: none; }

.pending-inputs-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	margin-bottom: 5px;
	color: var(--al-subtle-text, #6c7086);
}

.pending-inputs-list {
	max-height: 112px;
	overflow-y: auto;
}

.pending-input-item {
	display: grid;
	grid-template-columns: 22px minmax(0, 1fr);
	gap: 5px;
	padding: 3px 0;
	color: var(--al-body-text, #5c5f77);
}

.pending-input-order { color: var(--al-subtle-text, #8c8fa1); }
.pending-input-text { white-space: pre-wrap; overflow-wrap: anywhere; }

.pending-recall-btn {
	width: 26px;
	height: 24px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	background: transparent;
	color: var(--al-primary, #1e66f5);
	cursor: pointer;
}

.pending-recall-btn svg {
	width: 15px;
	height: 15px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.8;
	stroke-linecap: round;
	stroke-linejoin: round;
}

.toolbar-text-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 5px;
	height: 28px;
	min-width: 0;
	padding: 0 7px;
	border: 1px solid transparent;
	border-radius: 5px;
	background: transparent;
	color: #5d6475;
	font: 600 10px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
	white-space: nowrap;
	box-sizing: border-box;
	cursor: pointer;
	transition: border-color .15s ease, background-color .15s ease, color .15s ease;
}

.toolbar-text-btn:hover {
	background: #eef1f6;
	color: #1e66f5;
}

.toolbar-text-btn:focus-visible {
	outline: 2px solid rgba(30, 102, 245, .35);
	outline-offset: 1px;
}

.toolbar-text-btn:disabled {
	opacity: .5;
	cursor: default;
}

.toolbar-text-btn svg {
	flex: 0 0 auto;
	width: 14px;
	height: 14px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.7;
	stroke-linecap: round;
	stroke-linejoin: round;
}

.toolbar-btn-label {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.api-profile-switcher {
	position: relative;
	display: inline-flex;
	min-width: 0;
}

.api-profile-chip {
	max-width: 124px;
	min-width: 0;
}

.api-profile-chip .toolbar-btn-label {
	display: block;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.api-profile-menu {
	position: absolute;
	left: 0;
	bottom: calc(100% + 6px);
	z-index: 20;
	width: max-content;
	min-width: 140px;
	max-width: 240px;
	max-height: 240px;
	overflow-y: auto;
	padding: 4px;
	border: 1px solid #ccd3dd;
	border-radius: 6px;
	background: #fff;
	box-shadow: 0 6px 18px rgba(30, 38, 58, .16);
	box-sizing: border-box;
}

.api-profile-menu[hidden] { display: none; }

.api-profile-item {
	display: grid;
	grid-template-columns: 16px minmax(0, 1fr) auto;
	align-items: center;
	gap: 5px;
	width: 100%;
	min-height: 26px;
	padding: 3px 7px;
	border: 0;
	border-radius: 4px;
	background: transparent;
	color: #4c4f69;
	font: 11px/1.35 "Microsoft YaHei UI", "Segoe UI", sans-serif;
	text-align: left;
	cursor: pointer;
	box-sizing: border-box;
}

.api-profile-menu-title {
	padding: 5px 7px 3px;
	color: #7a8492;
	font: 600 10px/1.3 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.api-profile-menu-title:not(:first-child) {
	margin-top: 4px;
	border-top: 1px solid #e1e5eb;
	padding-top: 7px;
}

.api-profile-item:hover,
.api-profile-item:focus-visible {
	background: #eef1f6;
	outline: none;
}

.api-profile-item-name {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.api-profile-check {
	color: #1e66f5;
	font-weight: 700;
}

.api-profile-item-type {
	border: 1px solid #d7dce4;
	border-radius: 3px;
	padding: 1px 4px;
	color: #6b7280;
	font-size: 9px;
	line-height: 14px;
	white-space: nowrap;
}

.api-profile-item-type.group {
	border-color: #93c5fd;
	background: #eff6ff;
	color: #1d4ed8;
}

.mode-switcher {
	position: relative;
	display: inline-flex;
}

.mode-trigger {
	max-width: 104px;
}

.mode-trigger.active {
	background: rgba(30, 102, 245, .08);
	color: #1e66f5;
}

.mode-trigger-chevron {
	width: 11px !important;
	height: 11px !important;
	transition: transform .15s ease;
}

.mode-trigger[aria-expanded="true"] .mode-trigger-chevron {
	transform: rotate(180deg);
}

.mode-menu {
	position: absolute;
	right: 0;
	bottom: calc(100% + 7px);
	z-index: 24;
	width: 304px;
	padding: 5px;
	border: 1px solid #ccd3dd;
	border-radius: 7px;
	background: #fff;
	box-shadow: 0 8px 24px rgba(30, 38, 58, .18);
	box-sizing: border-box;
}

.mode-menu[hidden] { display: none; }

.mode-menu-title {
	padding: 4px 7px 5px;
	color: #7b8190;
	font: 600 10px/1.2 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.mode-menu-item {
	display: grid;
	grid-template-columns: 24px minmax(0, 1fr) 18px;
	align-items: center;
	gap: 8px;
	width: 100%;
	min-height: 48px;
	padding: 6px 8px;
	border: 0;
	border-radius: 5px;
	background: transparent;
	color: #4c4f69;
	text-align: left;
	cursor: pointer;
	box-sizing: border-box;
}

.mode-menu-item:hover,
.mode-menu-item:focus-visible {
	background: #eef1f6;
	outline: none;
}

.mode-menu-item:disabled {
	opacity: .46;
	cursor: default;
}

.mode-menu-item-icon {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	color: #5d6475;
}

.mode-menu-item-icon svg {
	width: 18px;
	height: 18px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.6;
	stroke-linecap: round;
	stroke-linejoin: round;
}

.mode-menu-item-copy {
	display: flex;
	flex-direction: column;
	gap: 2px;
	min-width: 0;
}

.mode-menu-item-title {
	font: 600 11px/1.25 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.mode-menu-item-description {
	color: #7b8190;
	font: 10px/1.35 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.mode-menu-item-state {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	color: #1e66f5;
	font: 700 13px/1 "Segoe UI", sans-serif;
}

.mode-menu-item.goal-active .mode-menu-item-state { color: #1e66f5; }
.mode-menu-item.goal-paused .mode-menu-item-state { color: #8a5a00; }
.mode-menu-item.goal-blocked .mode-menu-item-state { color: #b42318; }
.mode-menu-item.goal-complete .mode-menu-item-state { color: #2e7d32; }

.activity-dock {
	display: grid;
	gap: 6px;
}

.activity-dock[hidden],
.activity-panel[hidden] {
	display: none;
}

.activity-panel {
	min-width: 0;
	border: 1px solid var(--al-soft-border, #d4d9e3);
	border-radius: 7px;
	background: var(--al-panel-bg, #eff1f5);
	box-shadow: 0 1px 2px rgba(76, 79, 105, .06);
	overflow: hidden;
	transition: box-shadow .16s ease;
}

.activity-summary {
	display: flex;
	align-items: center;
	min-width: 0;
	min-height: 34px;
	padding: 3px 5px 3px 9px;
	box-sizing: border-box;
}

.activity-summary-main {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
	min-height: 28px;
	flex: 1 1 auto;
	border: 0;
	background: transparent;
	color: var(--al-text, #4c4f69);
	padding: 0;
	text-align: left;
	cursor: default;
}

.activity-summary-main[data-activity-action] { cursor: pointer; }

.activity-summary-main:focus-visible,
.activity-icon-btn:focus-visible {
	outline: 2px solid color-mix(in srgb, var(--al-primary, #1e66f5) 40%, transparent);
	outline-offset: 1px;
}

.activity-summary-icon,
.activity-chevron,
.activity-icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: 0 0 auto;
}

.activity-summary-icon {
	width: 16px;
	height: 16px;
	color: var(--al-muted-text, #6c7086);
}

.activity-summary-icon svg,
.activity-chevron svg,
.activity-icon-btn svg {
	width: 15px;
	height: 15px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.7;
	stroke-linecap: round;
	stroke-linejoin: round;
	pointer-events: none;
}

.activity-summary-label {
	flex: 0 0 auto;
	color: var(--al-plan-text, #374151);
	font-size: 11px;
	font-weight: 700;
	line-height: 16px;
	white-space: nowrap;
}

.activity-summary-text {
	min-width: 0;
	flex: 1 1 auto;
	overflow: hidden;
	color: var(--al-muted-text, #6c7086);
	font-size: 11px;
	line-height: 16px;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.activity-summary-actions {
	display: flex;
	align-items: center;
	gap: 1px;
	flex: 0 0 auto;
	margin-left: 4px;
}

.activity-icon-btn {
	width: 26px;
	height: 26px;
	border: 0;
	border-radius: 5px;
	background: transparent;
	color: var(--al-subtle-text, #8c8fa1);
	padding: 0;
	cursor: pointer;
}

	text-align: left;
	border: 0;

}

	font-size: 12px;
	line-height: 1.45;
	color: #374151;
	overflow-wrap: anywhere;
	word-break: break-word;
}

.page-msgbox-actions {
	display: flex;
	justify-content: flex-end;
	gap: 8px;
	margin-top: 10px;
}

<script>
window.autolinkerBusy = false;
window.autolinkerStopRequested = false;
window.autolinkerStopTooltip = "\u505c\u6b62";
window.autolinkerPlanState = "normal";
window.autolinkerAutoAllow = false;
window.autolinkerGoalState = { status: "none", objective: "", tokensUsed: 0, elapsedLabel: "0m 0s", label: "\u76EE\u6807" };
window.autolinkerGoalPanelOpen = false;
window.autolinkerGoalEditing = false;
window.autolinkerPlanDockExpanded = false;
window.autolinkerApiProfiles = { activeTargetType: "endpoint", activeProfileId: "", activeProfileName: "\u672A\u914D\u7F6E", profiles: [], pendingForNextRequest: false };
window.autolinkerContextUsageTitle = "\u4E0A\u4E0B\u6587\u7528\u91CF\u4E0D\u53EF\u7528";
window.autolinkerAttachments = [];
window.autolinkerAttachmentSequence = 1;

window.autolinkerSetPageVisible = function(visible) {
	document.documentElement.classList.toggle("autolinker-page-visible", !!visible);
};

window.autolinkerEscapeHtml = function(text) {
	return String(text || "")
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/\"/g, "&quot;")
		.replace(/'/g, "&#39;");
};

window.autolinkerApplyTheme = function(theme) {
	var colors = theme && theme.colors ? theme.colors : {};
	var map = {
		pageBg: "--al-page-bg",
		text: "--al-text",
		mutedText: "--al-muted-text",
		subtleText: "--al-subtle-text",
		brand: "--al-brand",
		primary: "--al-primary",
		primaryHover: "--al-primary-hover",
		accent: "--al-accent",
		success: "--al-success",
		warning: "--al-warning",
		danger: "--al-danger",
		border: "--al-border",
		softBorder: "--al-soft-border",
		panelBg: "--al-panel-bg",
		toolbarBg: "--al-toolbar-bg",
		composerBg: "--al-composer-bg",
		inputBg: "--al-input-bg",
		inputBorder: "--al-input-border",
		buttonBg: "--al-button-bg",
		buttonHoverBg: "--al-button-hover-bg",
		userMsgBg: "--al-user-msg-bg",
		assistantMsgBg: "--al-assistant-msg-bg",
		systemMsgBg: "--al-system-msg-bg",
		toolMsgBg: "--al-tool-msg-bg",
		planMsgBg: "--al-plan-msg-bg",
		roleText: "--al-role-text",
		bodyText: "--al-body-text",
		linkText: "--al-link-text",
		inlineCodeBg: "--al-inline-code-bg",
		codeBlockBg: "--al-code-block-bg",
		codeText: "--al-code-text",
		planBg: "--al-plan-bg",
		planBorder: "--al-plan-border",
		planText: "--al-plan-text",
		chipBg: "--al-chip-bg",
		approvalBg: "--al-approval-bg",
		diffBg: "--al-diff-bg",
		diffAdd: "--al-diff-add",
		diffDel: "--al-diff-del",
		placeholder: "--al-placeholder"
	};
	var root = document.documentElement;
	for (var key in map) {
		if (Object.prototype.hasOwnProperty.call(map, key) && colors[key]) {
			root.style.setProperty(map[key], colors[key]);
		}
	}
	var pageBg = String(colors.pageBg || "");
	var match = /^#([0-9a-f]{6})$/i.exec(pageBg);
	if (match) {
		var value = parseInt(match[1], 16);
		var red = (value >> 16) & 255;
		var green = (value >> 8) & 255;
		var blue = value & 255;
		root.style.colorScheme = ((red * 299 + green * 587 + blue * 114) / 1000) < 128 ? "dark" : "light";
	}
};

window.autolinkerLatestUserFloatFrame = 0;

window.autolinkerUpdateLatestUserFloat = function() {
	var root = document.getElementById("chat-root");
	var scroll = document.getElementById("history-scroll");
	var floating = document.getElementById("latest-user-float");
	if (!root || !scroll || !floating || !root.querySelectorAll) {
		return;
	}

	var users = root.querySelectorAll(".msg.user");
	var latest = users.length ? users[users.length - 1] : null;
	if (!latest) {
		floating.hidden = true;
		floating.textContent = "";
		floating.removeAttribute("title");
		return;
	}

	var viewportRect = scroll.getBoundingClientRect();
	var messageRect = latest.getBoundingClientRect();
	var visibleHeight = Math.min(messageRect.bottom, viewportRect.bottom) - Math.max(messageRect.top, viewportRect.top);
	if (visibleHeight > 1) {
		floating.hidden = true;
		return;
	}

	var body = latest.querySelector ? latest.querySelector(".body") : null;
	var text = String(body ? (body.textContent || "") : (latest.textContent || ""))
		.replace(/\s+/g, " ")
		.trim();
	if (!text) {
		floating.hidden = true;
		floating.textContent = "";
		floating.removeAttribute("title");
		return;
	}

	floating.textContent = text;
	floating.title = text;
	floating.hidden = false;
};

window.autolinkerScheduleLatestUserFloat = function() {
	if (window.autolinkerLatestUserFloatFrame) {
		return;
	}
	window.autolinkerLatestUserFloatFrame = window.requestAnimationFrame(function() {
		window.autolinkerLatestUserFloatFrame = 0;
		window.autolinkerUpdateLatestUserFloat();
	});
};

window.autolinkerShowPlanUserInputQuestion = function(card, requestedIndex, focusInput) {
	if (!card || !card.querySelectorAll) {
		return;
	}
	var questions = card.querySelectorAll(".plan-user-input-question");
	if (!questions.length) {
		return;
	}
	var index = Number(requestedIndex);
	if (!isFinite(index)) {
		index = 0;
	}
	index = Math.max(0, Math.min(questions.length - 1, Math.floor(index)));
	card.setAttribute("data-current-question-index", String(index));
	for (var i = 0; i < questions.length; i++) {
		questions[i].hidden = i !== index;
	}

	var progress = card.querySelector(".plan-user-input-progress");
	if (progress) {
		progress.textContent = "(" + (index + 1) + "/" + questions.length + ")";
	}
	var previous = card.querySelector("[data-plan-user-input-action='previous']");
	var next = card.querySelector("[data-plan-user-input-action='next']");
	var submit = card.querySelector("[data-plan-user-input-action='submit']");
	if (previous) {
		previous.hidden = index === 0;
	}
	if (next) {
		next.hidden = index >= questions.length - 1;
	}
	if (submit) {
		submit.hidden = index < questions.length - 1;
	}
	var error = card.querySelector(".plan-user-input-error");
	if (error) {
		error.hidden = true;
		error.textContent = "";
	}

	var question = questions[index];
	if (focusInput) {
		var target = question.querySelector("input[type='radio']:checked") ||
			question.querySelector("input, textarea");
		if (target) {
			target.focus();
		}
	}
	window.requestAnimationFrame(function() {
		var scroll = document.getElementById("history-scroll");
		if (!scroll || !question.getBoundingClientRect) {
			return;
		}
		var scrollRect = scroll.getBoundingClientRect();
		var questionRect = question.getBoundingClientRect();
		var head = card.querySelector(".plan-user-input-head");
		var headHeight = head ? head.getBoundingClientRect().height : 0;
		scroll.scrollTop += questionRect.top - scrollRect.top - headHeight;
	});
};

window.autolinkerInitializePlanUserInputCards = function(root) {
	if (!root || !root.querySelectorAll) {
		return;
	}
	var cards = root.querySelectorAll(".plan-user-input-card.active");
	for (var i = 0; i < cards.length; i++) {
		window.autolinkerShowPlanUserInputQuestion(
			cards[i],
			cards[i].getAttribute("data-current-question-index") || "0",
			false);
	}
};

window.autolinkerUpdateActivityDockVisibility = function() {
	var dock = document.getElementById("activity-dock");
	var plan = document.getElementById("active-plan-panel");
	var goal = document.getElementById("active-goal-panel");
	var goalDetails = document.getElementById("goal-panel");
	if (!dock) return;
	dock.hidden = (!plan || plan.hidden) && (!goal || goal.hidden) && (!goalDetails || goalDetails.hidden);
};

window.autolinkerRenderActivePlan = function(root) {
	var chatRoot = root || document.getElementById("chat-root");
	var panel = document.getElementById("active-plan-panel");
	if (!chatRoot || !panel || !chatRoot.querySelectorAll) return;
	var messages = chatRoot.querySelectorAll(".plan-message");
	for (var messageIndex = 0; messageIndex < messages.length; messageIndex++) {
		messages[messageIndex].hidden = false;
	}
	var source = messages.length ? messages[messages.length - 1] : null;
	var card = source && source.querySelector ? source.querySelector(".plan-card") : null;
	if (!card) {
		panel.hidden = true;
		panel.innerHTML = "";
		window.autolinkerUpdateActivityDockVisibility();
		return;
	}

	var steps = card.querySelectorAll ? card.querySelectorAll(".plan-step") : [];
	var completed = 0;
	var inProgress = 0;
	var pending = 0;
	for (var stepIndex = 0; stepIndex < steps.length; stepIndex++) {
		if (steps[stepIndex].classList.contains("completed")) completed++;
		else if (steps[stepIndex].classList.contains("in-progress")) inProgress++;
		else pending++;
	}
	var planModeActive = (window.autolinkerPlanState || "normal") !== "normal";
	var active = steps.length ? (inProgress + pending > 0) : planModeActive;
	if (!active) {
		panel.hidden = true;
		panel.innerHTML = "";
		window.autolinkerUpdateActivityDockVisibility();
		return;
	}

	source.hidden = true;
	var summary = steps.length
		? completed + " \u5df2\u5b8c\u6210 \u00b7 " + inProgress + " \u8fdb\u884c\u4e2d \u00b7 " + pending + " \u5f85\u5904\u7406"
		: String((card.querySelector(".plan-status") || {}).textContent || "\u6b63\u5728\u6267\u884c").trim();
	var expanded = !!window.autolinkerPlanDockExpanded;
	panel.classList.toggle("expanded", expanded);
	panel.innerHTML = '<div class="activity-summary"><button class="activity-summary-main" type="button" data-activity-action="toggle-plan" aria-expanded="' + (expanded ? "true" : "false") + '" title="' + (expanded ? "\u6536\u8d77\u8ba1\u5212" : "\u5c55\u5f00\u8ba1\u5212") + '">' +
		'<span class="activity-summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4" cy="6" r="1"></circle><path d="m3 12 1 1 2-2"></path><circle cx="4" cy="18" r="1"></circle></svg></span>' +
		'<span class="activity-summary-label">\u4efb\u52a1</span><span class="activity-summary-text">' + window.autolinkerEscapeHtml(summary) + '</span>' +
		'<span class="activity-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"></path></svg></span></button></div>' +
		'<div class="activity-details activity-plan-details"' + (expanded ? "" : " hidden") + '></div>';
	var details = panel.querySelector(".activity-plan-details");
	if (details) {
		details.appendChild(card.cloneNode(true));
		var planButtons = details.querySelectorAll ? details.querySelectorAll(".plan-action") : [];
		for (var buttonIndex = 0; buttonIndex < planButtons.length; buttonIndex++) {
			planButtons[buttonIndex].disabled = !!window.autolinkerBusy;
		}
	}
	panel.hidden = false;
	window.autolinkerUpdateActivityDockVisibility();
};

window.autolinkerRenderActiveGoal = function() {
	var panel = document.getElementById("active-goal-panel");
	if (!panel) return;
	var data = window.autolinkerGoalState || {};
	var status = data.status || "none";
	if (status === "none") {
		panel.hidden = true;
		panel.innerHTML = "";
		window.autolinkerUpdateActivityDockVisibility();
		return;
	}

	var labels = {
		active: "\u8fdb\u884c\u4e2d\u7684\u76ee\u6807",
		paused: "\u5df2\u6682\u505c\u7684\u76ee\u6807",
		blocked: "\u53d7\u963b\u7684\u76ee\u6807",
		complete: "\u5df2\u5b8c\u6210\u7684\u76ee\u6807"
	};
	var objective = String(data.objective || "");
	var title = objective + "\n" + String(data.elapsedLabel || "0m 0s") + " \u00b7 " + Number(data.tokensUsed || 0) + " tokens";
	if (data.suspendedByPlan) title += "\n\u8ba1\u5212\u6a21\u5f0f\u4e2d\u5df2\u6682\u6302";
	var actionHtml = "";
	if (status === "active") {
		actionHtml += '<button class="activity-icon-btn" type="button" data-goal-action="pause" title="\u6682\u505c\u76ee\u6807" aria-label="\u6682\u505c\u76ee\u6807"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"></path></svg></button>';
	} else if (status === "paused" || status === "blocked") {
		actionHtml += '<button class="activity-icon-btn" type="button" data-goal-action="resume" title="\u6062\u590d\u76ee\u6807" aria-label="\u6062\u590d\u76ee\u6807"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"></path></svg></button>';
	}
	actionHtml += '<button class="activity-icon-btn" type="button" data-goal-action="edit" title="\u7f16\u8f91\u76ee\u6807" aria-label="\u7f16\u8f91\u76ee\u6807"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg></button>';
	actionHtml += '<button class="activity-icon-btn danger" type="button" data-goal-action="clear" title="\u6e05\u9664\u76ee\u6807" aria-label="\u6e05\u9664\u76ee\u6807"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path></svg></button>';
	panel.className = "activity-panel goal-" + status;
	panel.innerHTML = '<div class="activity-summary"><div class="activity-summary-main" title="' + window.autolinkerEscapeHtml(title) + '">' +
		'<span class="activity-summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></span>' +
		'<span class="activity-summary-label">' + (labels[status] || "\u76ee\u6807") + '</span><span class="activity-summary-text">' + window.autolinkerEscapeHtml(objective) + '</span>' +
		'</div>' +
		'<div class="activity-summary-actions">' + actionHtml + '</div></div>';
	panel.hidden = false;
	window.autolinkerUpdateActivityDockVisibility();
};

window.autolinkerSetChatHtml = function(html) {
	var root = document.getElementById("chat-root");
	var scroll = document.getElementById("history-scroll");
	var followBottom = !scroll || scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight <= 24;
	var previousScrollTop = scroll ? scroll.scrollTop : 0;
	if (root) {
		root.innerHTML = html || "";
		var planButtons = root.querySelectorAll ? root.querySelectorAll(".plan-action") : [];
		for (var i = 0; i < planButtons.length; i++) {
			planButtons[i].disabled = !!window.autolinkerBusy;
		}
		window.autolinkerInitializePlanUserInputCards(root);
		window.autolinkerRenderActivePlan(root);
		window.autolinkerAwaitingPlanUserInput = !!(root.querySelector && root.querySelector(".plan-user-input-card.active"));
		if (typeof window.autolinkerSetBusy === "function") {
			window.autolinkerSetBusy(
				!!window.autolinkerBusy,
				!!window.autolinkerStopRequested,
				window.autolinkerStopTooltip || "\u505c\u6b62");
		}
		if (scroll) {
			scroll.scrollTop = followBottom ? scroll.scrollHeight : previousScrollTop;
		}
		window.autolinkerScheduleLatestUserFloat();
	}
};

window.autolinkerSetUpdateTag = function(show) {
	var tag = document.getElementById("update-tag");
	if (tag) {
		tag.hidden = !show;
	}
};

window.autolinkerRenderModeControl = function() {
	var planState = window.autolinkerPlanState || "normal";
	var planActive = planState !== "normal";
	var autoActive = !!window.autolinkerAutoAllow;
	var manualActive = !planActive && !autoActive;
	var trigger = document.getElementById("mode-trigger");
	var triggerLabel = document.getElementById("mode-trigger-label");
	var manualItem = document.getElementById("manual-mode-item");
	var planItem = document.getElementById("plan-mode-btn");
	var autoItem = document.getElementById("auto-allow-btn");
	var goalItem = document.getElementById("goal-mode-btn");
	var goalDescription = document.getElementById("goal-mode-description");
	var summary = planActive && autoActive
		? "\u8BA1\u5212 + \u81EA\u52A8"
		: (planActive ? "\u8BA1\u5212" : (autoActive ? "\u81EA\u52A8" : "\u624B\u52A8"));
	if (triggerLabel) triggerLabel.textContent = summary;
	if (trigger) {
		trigger.classList.toggle("active", !manualActive);
		trigger.title = "\u5F53\u524D\u6A21\u5F0F\uFF1A" + summary;
		trigger.setAttribute("aria-label", "\u9009\u62E9\u5BF9\u8BDD\u6A21\u5F0F\uFF0C\u5F53\u524D\u4E3A " + summary);
	}
	function setChecked(item, checked) {
		if (!item) return;
		item.setAttribute("aria-checked", checked ? "true" : "false");
		var state = item.querySelector ? item.querySelector(".mode-menu-item-state") : null;
		if (state) state.textContent = checked ? "\u2713" : "";
	}
	setChecked(manualItem, manualActive);
	setChecked(planItem, planActive);
	setChecked(autoItem, autoActive);
	if (planItem) planItem.disabled = !!window.autolinkerBusy;
	if (manualItem) manualItem.disabled = !!window.autolinkerBusy && planActive;

	var goal = window.autolinkerGoalState || {};

		if (goalState) goalState.textContent = goalStatus === "none" ? "" : "\u2022";
	}
	if (goalDescription) {
		var goalText = "\u521B\u5EFA\u6216\u7BA1\u7406\u957F\u671F\u4EFB\u52A1";
		if (goalStatus === "active") goalText = "\u8FDB\u884C\u4E2D\u00B7" + (goal.elapsedLabel || "0m 0s");
		else if (goalStatus === "paused") goalText = "\u5DF2\u6682\u505C\uFF0C\u53EF\u5728\u76EE\u6807\u9762\u677F\u6062\u590D";

		else if (goalStatus === "complete") goalText = "\u5DF2\u5B8C\u6210\uFF0C\u53EF\u67E5\u770B\u6216\u6E05\u9664";
		goalDescription.textContent = goalText;
	}
};

window.autolinkerRenderGoalPanel = function() {
	var panel = document.getElementById("goal-panel");
	if (!panel) return;
	var data = window.autolinkerGoalState || {};
	var status = data.status || "none";
	var formVisible = status === "none" || !!window.autolinkerGoalEditing;
	// 状态会在 AI 流式输出期间频繁刷新，重建 DOM 前保留用户尚未提交的目标草稿。
	var objectiveId = status === "none" ? "goal-objective" : "goal-objective-edit";
	var existingObjective = panel.querySelector ? panel.querySelector("#" + objectiveId) : null;
	var draftObjective = existingObjective ? existingObjective.value : null;
	var draftWasFocused = existingObjective && document.activeElement === existingObjective;
	var draftSelectionStart = existingObjective ? existingObjective.selectionStart : 0;
	var draftSelectionEnd = existingObjective ? existingObjective.selectionEnd : 0;
	if (!window.autolinkerGoalPanelOpen || !formVisible) {
		if (!formVisible) window.autolinkerGoalPanelOpen = false;
		panel.hidden = true;
		panel.innerHTML = "";
		window.autolinkerUpdateActivityDockVisibility();
		return;
	}
	var html = '<div class="goal-panel-head"><div class="goal-panel-title">' + window.autolinkerEscapeHtml(data.label || "\u76EE\u6807") + '</div>';
	if (status !== "none") {
		html += '<div class="goal-panel-meta">';
		if (data.suspendedByPlan) html += '<span>\u8BA1\u5212\u6A21\u5F0F\u4E2D\u5DF2\u6682\u6302</span>';
		html += '<span>' + window.autolinkerEscapeHtml(data.elapsedLabel || "0m 0s") + '</span><span>' + Number(data.tokensUsed || 0) + ' tokens</span></div>';
	}
	html += '</div>';
	if (status === "none") {
		html += '<textarea id="goal-objective" class="goal-objective" maxlength="8000" placeholder="\u76EE\u6807"></textarea>';
		html += '<div class="goal-panel-actions"><button class="btn" type="button" data-goal-action="cancel">\u53D6\u6D88</button><button class="btn primary" type="button" data-goal-action="create">\u5F00\u542F</button></div>';
	} else {
		html += '<textarea id="goal-objective-edit" class="goal-objective" maxlength="8000">' + window.autolinkerEscapeHtml(data.objective || "") + '</textarea>';
		html += '<div class="goal-panel-actions"><button class="btn" type="button" data-goal-action="cancel_edit">\u53D6\u6D88</button><button class="btn primary" type="button" data-goal-action="save_edit">\u4FDD\u5B58</button></div>';
	}
	panel.innerHTML = html;
	panel.hidden = false;
	window.autolinkerUpdateActivityDockVisibility();
	if (status === "none" || window.autolinkerGoalEditing) {
		var objective = document.getElementById(status === "none" ? "goal-objective" : "goal-objective-edit");
		if (objective) {
			if (draftObjective !== null) {
				objective.value = draftObjective;
				if (draftWasFocused) {
					objective.focus();
					objective.setSelectionRange(draftSelectionStart, draftSelectionEnd);
				}
			} else {
				objective.focus();
				if (window.autolinkerGoalEditing) objective.setSelectionRange(objective.value.length, objective.value.length);
			}
		}
	}
};

window.autolinkerSetBusy = function(busy, stopRequested, stopTooltip) {
	var send = document.getElementById("send-btn");
	var attach = document.getElementById("attach-btn");
	var stop = document.getElementById("stop-btn");
	var newSession = document.getElementById("new-session-btn");
	var restore = document.getElementById("restore-btn");
	var settings = document.getElementById("settings-btn");
	var mcpSettings = document.getElementById("mcp-settings-btn");
	var skillSettings = document.getElementById("skill-settings-btn");
	var clearConfirm = document.getElementById("clear-confirm");
	var restoreConfirm = document.getElementById("restore-confirm");
	var input = document.getElementById("chat-input");
	var isBusy = !!busy;
	var isStopping = !!stopRequested;
	var resolvedStopTooltip = typeof stopTooltip === "string" && stopTooltip
		? stopTooltip
		: "\u505c\u6b62";
	var waitingForPlanInput = !!window.autolinkerAwaitingPlanUserInput;
	window.autolinkerBusy = isBusy;
	window.autolinkerStopRequested = isStopping;
	window.autolinkerStopTooltip = resolvedStopTooltip;
	if (send) {
		send.disabled = waitingForPlanInput;
		send.style.display = "";
	}
	if (attach) {
		attach.disabled = waitingForPlanInput;
	}
	if (stop) {
		stop.disabled = !isBusy || isStopping;
		stop.title = isStopping ? "\u505C\u6B62\u4E2D..." : resolvedStopTooltip;
		stop.setAttribute("aria-label", stop.title);
		stop.style.display = isBusy ? "" : "none";
	}
	if (newSession) {
		newSession.disabled = isBusy;
	}
	if (restore) {
		restore.disabled = isBusy;
	}
	if (settings) {
		settings.disabled = isBusy;
	}
	if (mcpSettings) {
		mcpSettings.disabled = isBusy;
	}
	if (skillSettings) {
		skillSettings.disabled = isBusy;
	}
	if (input) {
		input.disabled = waitingForPlanInput;
	}
	window.autolinkerRenderModeControl();
	var planButtons = document.querySelectorAll ? document.querySelectorAll(".plan-action") : [];
	for (var i = 0; i < planButtons.length; i++) {
		planButtons[i].disabled = isBusy;
	}
	if (isBusy) {
		var sessionMenu = document.getElementById("session-menu");
		if (sessionMenu) {
			sessionMenu.hidden = true;
		}
		if (clearConfirm) {
			clearConfirm.hidden = true;
		}
		if (restoreConfirm) {
			restoreConfirm.hidden = true;
		}
	}
};

window.autolinkerResizeChatInput = function(input) {
	if (!input) {
		return;
	}
	var maxHeight = 220;
	var minHeight = 40;
	input.style.height = "auto";
	var nextHeight = Math.max(minHeight, Math.min(input.scrollHeight, maxHeight));
	input.style.height = nextHeight + "px";
	input.style.overflowY = input.scrollHeight > maxHeight ? "auto" : "hidden";
};

window.autolinkerFormatBytes = function(bytes) {
	var value = Number(bytes || 0);
	if (value < 1024) return value + " B";
	if (value < 1024 * 1024) return Math.round(value / 1024) + " KB";
	return (value / (1024 * 1024)).toFixed(1) + " MB";
};

window.autolinkerRenderAttachments = function() {

		html += '<div class="attachment-size">' + window.autolinkerFormatBytes(item.size) + '</div></div>';

window.autolinkerSetAttachments = function(items) {
	window.autolinkerAttachments = [];
	var values = Array.isArray(items) ? items : [];
	for (var i = 0; i < values.length && i < 10; i++) {
		var item = values[i] || {};
		if (!item.dataUrl) continue;
		window.autolinkerAttachments.push({
			id: "image-" + (window.autolinkerAttachmentSequence++),
			name: item.name || "image.png",
			mimeType: item.mimeType || "image/png",
			size: Number(item.size || 0),
			dataUrl: item.dataUrl,
			detail: item.detail || "auto"
		});
	}
	window.autolinkerRenderAttachments();
};

window.autolinkerAddImageFiles = function(fileList) {
	var files = fileList ? Array.prototype.slice.call(fileList) : [];
	for (var i = 0; i < files.length; i++) {
		if (window.autolinkerAttachments.length >= 10) break;
		var file = files[i];
		if (!file || String(file.type || "").indexOf("image/") !== 0 || Number(file.size || 0) <= 0 || Number(file.size || 0) > 20 * 1024 * 1024) continue;
		(function(imageFile) {
			var reader = new FileReader();
			reader.onload = function() {
				if (window.autolinkerAttachments.length >= 10 || typeof reader.result !== "string") return;
				window.autolinkerAttachments.push({
					id: "image-" + (window.autolinkerAttachmentSequence++),
					name: imageFile.name || "image.png",
					mimeType: imageFile.type || "image/png",
					size: Number(imageFile.size || 0),
					dataUrl: reader.result,
					detail: "auto"
				});
				window.autolinkerRenderAttachments();
			};
			reader.readAsDataURL(imageFile);
		})(file);
	}
};

window.autolinkerRenderDiffPreview = function(text) {
	var lines = String(text || "").split(/\r?\n/);
	var html = "";
	for (var i = 0; i < lines.length; i++) {
		var line = lines[i];
		var cls = "";
		if (line.indexOf("@@") === 0) {
			cls = "diff-hunk";
		} else if (line.indexOf("+") === 0) {
			cls = "diff-add";
		} else if (line.indexOf("-") === 0) {
			cls = "diff-del";
		}
		html += '<div' + (cls ? ' class="' + cls + '"' : "") + '>' + window.autolinkerEscapeHtml(line || " ") + '</div>';
	}
	return html;
};

		return new Promise(function(resolve, reject) {
			var area = document.createElement("textarea");

			area.setAttribute("readonly", "readonly");
			area.style.position = "fixed";
			area.style.left = "-9999px";
			document.body.appendChild(area);

	document.addEventListener("mousedown", function(e) {
		if (sessionMenu && !sessionMenu.hidden) {
			var insideMenu = sessionMenu.contains(e.target);
			var onRestoreBtn = restore && restore.contains && restore.contains(e.target);
			if (!insideMenu && !onRestoreBtn) {
				hideSessionMenu();
			}
		}
		if (apiProfileMenu && !apiProfileMenu.hidden) {
			var insideApiMenu = apiProfileMenu.contains(e.target);
			var onApiProfile = apiProfile && apiProfile.contains && apiProfile.contains(e.target);
			if (!insideApiMenu && !onApiProfile) hideApiProfileMenu();
		}
		if (modeMenu && !modeMenu.hidden) {
			var insideModeMenu = modeMenu.contains(e.target);
			var onModeTrigger = modeTrigger && modeTrigger.contains && modeTrigger.contains(e.target);
			if (!insideModeMenu && !onModeTrigger) hideModeMenu();
		}
	});

	document.addEventListener("keydown", function(e) {
		if (e.key === "Escape") {
			if (modeMenu && !modeMenu.hidden) {
				hideModeMenu();
				if (modeTrigger) modeTrigger.focus();
				return;
			}
			if (apiProfileMenu && !apiProfileMenu.hidden) {
				hideApiProfileMenu();
				if (apiProfile) apiProfile.focus();
				return;
			}
			var approval = document.getElementById("tool-approval");
			if (approval && !approval.hidden) {
				var denyBtn = approval.querySelector ? approval.querySelector("[data-tool-action='deny']") : null;
				post({ action: "deny_tool", id: denyBtn ? (denyBtn.getAttribute("data-approval-id") || "0") : "0" });
				return;
			}
			if (restoreConfirm && !restoreConfirm.hidden) {
				hideRestoreConfirm();
				post({ action: "restore_cancel" });
				return;
			}
			hideClearConfirm();
		}
	});

	if (input) {
		input.addEventListener("input", function() {
			window.autolinkerResizeChatInput(input);
		});
		input.addEventListener("keydown", function(e) {
			if (e.key === "ArrowUp" && e.altKey) {
				e.preventDefault();
				post({ action: "recall_pending" });
				return;
			}
			if (e.key === "Enter" && !e.ctrlKey && !e.shiftKey) {
				e.preventDefault();
				doSend();
			}
		});
		setTimeout(function() {
			window.autolinkerRenderModeControl();
			window.autolinkerResizeChatInput(input);
			if (document.documentElement.classList.contains("autolinker-page-visible")) {
				input.focus();
			}
		}, 0);
	}
})();
</script>
</body>
</html>
