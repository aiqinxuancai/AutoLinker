<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
	margin: 0;
	padding: 0;
	background: #e6e9ef;
	color: #4c4f69;
	font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

body {
	padding: 0;
}

html:not(.autolinker-page-visible) *,
html:not(.autolinker-page-visible) *::before,
html:not(.autolinker-page-visible) *::after {
	animation-play-state: paused !important;
}

.layout {
	display: flex;
	flex-direction: column;
	height: 100vh;
	box-sizing: border-box;
	position: relative;
}

.topbar {
	flex: 0 0 36px;
	height: 36px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	background: #e6e9ef;
	padding: 0 10px 0 12px;
	box-sizing: border-box;
	position: relative;
}

.topbar-brand {
	color: #8839ef;
	font-size: 13px;
	font-weight: 300;
	line-height: 1;
	letter-spacing: 0;
	text-transform: uppercase;
	white-space: nowrap;
	cursor: pointer;
}

.topbar-left {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
}

.update-tag {
	display: inline-flex;
	align-items: center;
	height: 16px;
	padding: 0 7px;
	border-radius: 5px;
	background: linear-gradient(110deg, #8839ef, #1e66f5);
	color: #fff;
	font-size: 10px;
	font-weight: 700;
	letter-spacing: .6px;
	line-height: 1;
	text-decoration: none;
	white-space: nowrap;
	cursor: pointer;
	box-shadow: 0 1px 4px rgba(136, 57, 239, .35);
	animation: update-tag-pulse 1.9s ease-in-out infinite;
}

.update-tag[hidden] {
	display: none;
}

.update-tag:hover {
	filter: brightness(1.08);
}

@keyframes update-tag-pulse {
	0%, 100% { box-shadow: 0 1px 4px rgba(136, 57, 239, .35); }
	50% { box-shadow: 0 1px 9px rgba(30, 102, 245, .58); }
}

.topbar-actions {
	display: flex;
	align-items: center;
	gap: 8px;
}

.top-action {
	width: 24px;
	height: 24px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	border-radius: 0;
	background: transparent;
	color: #4c4f69;
	padding: 0;
	cursor: pointer;
}

.top-action:hover {
	color: #0b63c9;
}

.top-action.active {
	color: #1e66f5;
	background: #dce9ff;
	border-radius: 6px;
}

.top-action:focus-visible {
	outline: 1px solid #4c4f69;
	outline-offset: 2px;
}

.top-action:disabled {
	opacity: .45;
	cursor: default;
}

.top-action svg {
	width: 14px;
	height: 14px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.25;
	stroke-linecap: round;
	stroke-linejoin: round;
	pointer-events: none;
}

.top-action.mcp-action {
	width: 36px;
	font-size: 10px;
	font-weight: 700;
	letter-spacing: 0;
}

.history-pane {
	flex: 1 1 auto;
	min-height: 0;
	position: relative;
	overflow: hidden;
	background: #e6e9ef;
}

.history {
	width: 100%;
	height: 100%;
	overflow: auto;
	padding: 0;
	box-sizing: border-box;
	background: #e6e9ef;
	font-size: 12px;
	color: #4c4f69;
}

.latest-user-float {
	position: absolute;
	top: 8px;
	left: 20px;
	right: 20px;
	z-index: 4;
	padding: 4px 9px;
	border: 1px solid #d7dbe3;
	border-radius: 6px;
	background: #eff1f5;
	box-shadow: 0 2px 8px rgba(30, 38, 58, .12);
	box-sizing: border-box;
	color: #4c4f69;
	font-size: 11px;
	line-height: 16px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	pointer-events: none;
}

.latest-user-float[hidden] {
	display: none;
}

#chat-root {
	min-height: 100%;
	background: #e6e9ef;
	display: flex;
	flex-direction: column;
}

.composer {
	flex: 0 0 auto;
	border-top: 1px solid #d7dbe3;
	background: #e6e9ef;
	padding: 12px 12px 14px 12px;
	box-sizing: border-box;
	position: relative;
}

.actions {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 8px;
}

.left-actions,
.right-actions {
	display: flex;
	align-items: center;
	gap: 8px;
}

.right-actions {
	margin-left: auto;
}

.session-status[hidden] {
	display: none;
}

.session-status {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	height: 18px;
	padding: 0 7px;
	border: 1px solid #ccd3dd;
	border-radius: 5px;
	background: #fff;
	color: #4c4f69;
	font: 700 10px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
	box-sizing: border-box;
}

.session-status.working {
	border-color: rgba(30, 102, 245, .32);
	background: rgba(30, 102, 245, .08);
	color: #1e66f5;
}

.session-status.done {
	border-color: rgba(46, 125, 50, .28);
	background: rgba(46, 125, 50, .08);
	color: #2e7d32;
}

.input-wrap {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

.empty-state {
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 24px;
	padding: 28px 20px;
	box-sizing: border-box;
	text-align: center;
}

.empty-state-title {
	font-size: 34px;
	font-weight: 800;
	letter-spacing: 3px;
	line-height: 1.25;
	background: linear-gradient(110deg, #8839ef 0%, #1e66f5 42%, #04a5e5 78%, #8839ef 100%);
	background-size: 220% auto;
	-webkit-background-clip: text;
	background-clip: text;
	-webkit-text-fill-color: transparent;
	color: transparent;
	filter: drop-shadow(0 2px 12px rgba(136, 57, 239, .26));
	animation: empty-state-flow 7s ease-in-out infinite;
	user-select: none;
}

@keyframes empty-state-flow {
	0% { background-position: 0% center; }
	50% { background-position: 100% center; }
	100% { background-position: 0% center; }
}

.empty-state-links {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
}

.empty-state-news {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 8px;
	width: min(620px, 100%);
}

.news-config-text {
	width: 100%;
	max-width: 620px;
	padding: 9px 14px;
	border: 1px solid rgba(76, 79, 105, .18);
	border-radius: 6px;
	background: rgba(239, 241, 245, .72);
	color: #4c4f69;
	font-size: 13px;
	line-height: 1.5;
	text-align: left;
	white-space: pre-wrap;
}

.news-config-text-title {
	margin-bottom: 3px;
	color: #1e66f5;
	font-weight: 700;
}

.empty-state-links a {
	display: inline-block;
	font-size: 13px;
	line-height: 1.2;
	color: #1e66f5;
	text-decoration: none;
	padding: 8px 18px;
	border: 1px solid rgba(30, 102, 245, .26);
	border-radius: 6px;
	background: rgba(30, 102, 245, .06);
	transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
	cursor: pointer;
}

.empty-state-links a:hover {
	color: #fff;
	background: #1e66f5;
	border-color: #1e66f5;
	box-shadow: 0 6px 16px rgba(30, 102, 245, .26);
}

.input-area {
	position: relative;
	margin-top: 2px;
}

.pending-inputs {
	margin: 0 0 8px;
	padding: 8px 10px;
	border: 1px solid #d4d9e3;
	border-radius: 6px;
	background: rgba(255, 255, 255, .55);
	font: 12px/1.45 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}

.pending-inputs[hidden] { display: none; }

.pending-inputs-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	margin-bottom: 5px;
	color: var(--al-subtle-text, #6c7086);
}

.pending-inputs-list {
	max-height: 112px;
	overflow-y: auto;
}

.pending-input-item {
	display: grid;
	grid-template-columns: 22px minmax(0, 1fr);
	gap: 5px;
	padding: 3px 0;
	color: var(--al-body-text, #5c5f77);
}

.pending-input-order { color: var(--al-subtle-text, #8c8fa1); }
.pending-input-text { white-space: pre-wrap; overflow-wrap: anywhere; }

.pending-recall-btn {
	width: 26px;
	height: 24px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	background: transparent;
	color: var(--al-primary, #1e66f5);
	cursor: pointer;
}

.pending-recall-btn svg {
	width: 15px;
	height: 15px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.8;
	stroke-linecap: round;
	stroke-linejoin: round;
}

.mode-bar {
	display: flex;
	align-items: center;
	gap: 8px;
	min-width: 0;
}

.mode-chip {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	height: 18px;
	padding: 0 7px;
	border: 1px solid transparent;
	border-radius: 5px;
	background: transparent;
	color: #9aa0b0;
	font: 700 10px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
	white-space: nowrap;
	box-sizing: border-box;
	cursor: pointer;
	transition: border-color .15s ease, background-color .15s ease, color .15s ease;
}

.mode-chip:hover {
	color: #5d6475;
}

.mode-chip.active {
	border-color: rgba(30, 102, 245, .32);
	background: rgba(30, 102, 245, .08);
	color: #1e66f5;
}

.mode-chip.auto.active {
	border-color: rgba(46, 125, 50, .3);
	background: rgba(46, 125, 50, .08);
	color: #2e7d32;
}

.mode-chip.goal.active { color: #1e66f5; }
.mode-chip.goal.paused { color: #8a5a00; border-color: rgba(138, 90, 0, .35); background: rgba(138, 90, 0, .08); }
.mode-chip.goal.blocked { color: #b42318; border-color: rgba(180, 35, 24, .32); background: rgba(180, 35, 24, .08); }
.mode-chip.goal.complete { color: #2e7d32; border-color: rgba(46, 125, 50, .3); background: rgba(46, 125, 50, .08); }

.api-profile-switcher {
	position: relative;
	display: inline-flex;
	min-width: 0;
}

.api-profile-chip {
	max-width: 90px;
	min-width: 0;
}

.api-profile-chip .mode-label {
	display: block;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.api-profile-menu {
	position: absolute;
	left: 0;
	bottom: calc(100% + 6px);
	z-index: 20;
	width: max-content;
	min-width: 140px;
	max-width: 240px;
	max-height: 240px;
	overflow-y: auto;
	padding: 4px;
	border: 1px solid #ccd3dd;
	border-radius: 6px;
	background: #fff;
	box-shadow: 0 6px 18px rgba(30, 38, 58, .16);
	box-sizing: border-box;
}

.api-profile-menu[hidden] { display: none; }

.api-profile-item {
	display: grid;
	grid-template-columns: 16px minmax(0, 1fr);
	align-items: center;
	gap: 5px;
	width: 100%;
	min-height: 26px;
	padding: 3px 7px;
	border: 0;
	border-radius: 4px;
	background: transparent;
	color: #4c4f69;
	font: 11px/1.35 "Microsoft YaHei UI", "Segoe UI", sans-serif;
	text-align: left;
	cursor: pointer;
	box-sizing: border-box;
}

.api-profile-item:hover,
.api-profile-item:focus-visible {
	background: #eef1f6;
	outline: none;
}

.api-profile-item-name {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.api-profile-check {
	color: #1e66f5;
	font-weight: 700;
}

.goal-panel {
	margin-bottom: 8px;
	padding: 9px 0;
	border-top: 1px solid var(--al-soft-border, #d7dbe3);
	border-bottom: 1px solid var(--al-soft-border, #d7dbe3);
}

.goal-panel[hidden] { display: none; }
.goal-panel-head,
.goal-panel-actions,
.goal-panel-meta {
	display: flex;
	align-items: center;
	gap: 8px;
}
.goal-panel-head { justify-content: space-between; margin-bottom: 7px; }
.goal-panel-title { color: var(--al-text, #4c4f69); font-size: 11px; font-weight: 700; }
.goal-panel-meta { color: var(--al-subtle-text, #8c8fa1); font-size: 10px; }
.goal-objective {
	width: 100%;
	min-height: 54px;
	max-height: 132px;
	box-sizing: border-box;
	resize: vertical;
	border: 1px solid var(--al-soft-border, #d4d9e3);
	border-radius: 6px;
	padding: 8px 9px;
	background: var(--al-input-bg, #fff);
	color: var(--al-text, #4c4f69);
	font: 12px/1.5 "Microsoft YaHei UI", "Segoe UI", sans-serif;
}
.goal-objective-view {
	max-height: 100px;
	overflow: auto;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
	color: var(--al-text, #4c4f69);
	font-size: 12px;
	line-height: 1.55;
	margin-bottom: 8px;
}
.goal-panel-actions { justify-content: flex-end; margin-top: 8px; }

.mode-chip:focus-visible {
	outline: 2px solid rgba(30, 102, 245, .35);
	outline-offset: 2px;
}

.mode-chip:disabled {
	opacity: .5;
	cursor: default;
}

#chat-input {
	width: 100%;
	min-height: 60px;
	max-height: 220px;
	resize: none;
	box-sizing: border-box;
	border: 1px solid #d4d9e3;
	border-radius: 6px;
	padding: 11px 44px 11px 12px;
	font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", sans-serif;
	color: #4c4f69;
	outline: none;
	background: #fff;
	overflow: hidden;
	box-shadow: 0 1px 2px rgba(76, 79, 105, .05);
	transition: border-color .15s ease, box-shadow .15s ease;
}

#chat-input::placeholder {
	color: #9ca3b4;
}

#chat-input:focus {
	border-color: #1e66f5;
	box-shadow: 0 0 0 3px rgba(30, 102, 245, .12), 0 1px 3px rgba(30, 102, 245, .08);
}

.btn {
	border: 1px solid #d2d7e0;
	background: #fff;
	border-radius: 6px;
	padding: 6px 14px;
	font: 12px "Microsoft YaHei UI", "Segoe UI", sans-serif;
	color: #4c4f69;
	cursor: pointer;
	transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
}

.btn:hover {
	background: #eef1f6;
	border-color: #c2c8d4;
}

.btn.primary {
	background: #1e66f5;
	border-color: #1e66f5;
	color: #fff;
}

.btn.primary:hover {
	background: #1554d1;
	border-color: #1554d1;
}

.send-icon-btn {
	position: absolute;
	right: 8px;
	bottom: 8px;
	width: 28px;
	height: 28px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	border-radius: 6px;
	background: transparent;
	color: #1e66f5;
	padding: 0;
	cursor: pointer;
	transition: color .15s ease, transform .1s ease;
}

.send-icon-btn:hover {
	color: #1554d1;
}

.send-icon-btn:active {
	transform: scale(.9);
}

.send-icon-btn:focus-visible {
	outline: 2px solid rgba(30, 102, 245, .4);
	outline-offset: 2px;
}

.send-icon-btn:disabled {
	color: #b9bfca;
	cursor: default;
}

.send-icon-btn svg {
	width: 17px;
	height: 17px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.6;
	stroke-linecap: round;
	stroke-linejoin: round;
	pointer-events: none;
}

.stop-icon-btn {
	position: absolute;
	right: 8px;
	bottom: 8px;
	width: 28px;
	height: 28px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border: 0;
	border-radius: 6px;
	background: transparent;
	color: #1e66f5;
	padding: 0;
	cursor: pointer;
	transition: color .15s ease, transform .1s ease;
}

.stop-icon-btn:hover {
	color: #1554d1;
}

.stop-icon-btn:active {
	transform: scale(.92);
}

.stop-icon-btn:focus-visible {
	outline: 2px solid rgba(30, 102, 245, .4);
	outline-offset: 2px;
}

.stop-icon-btn:disabled {
	color: #9aa0ac;
	cursor: default;
}

.stop-icon-btn::before {
	content: "";
	position: absolute;
	inset: 3px;
	border-radius: 50%;
	border: 1px solid rgba(30, 102, 245, .18);
	border-top-color: currentColor;
	animation: stop-spin .8s linear infinite;
	pointer-events: none;
}

.stop-icon-btn:disabled::before {
	border-color: rgba(150, 156, 168, .22);
	border-top-color: currentColor;
}

@keyframes stop-spin {
	to { transform: rotate(360deg); }
}

.stop-icon-btn svg {
	width: 12px;
	height: 12px;
	fill: currentColor;
	pointer-events: none;
}

.icon-btn {
	width: 30px;
	height: 30px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
}

.icon-btn svg {
	width: 16px;
	height: 16px;
	fill: currentColor;
	pointer-events: none;
}

.btn:disabled {
	opacity: .55;
	cursor: default;
}

.msg {
	border: 0;
	border-bottom: 1pt solid #e6e9ef;
	border-radius: 0;
	padding: 10px 12px;
	margin: 0;
	box-sizing: border-box;
	overflow: hidden;
	color: #4c4f69;
}

.msg.user {
	background: #eff1f5;
}

.msg.assistant {
	background: #e6e9ef;
}

.msg.tool {
	background: #e6e9ef;
}

.msg.system {
	background: #e6e9ef;
}

.plan-message {
	background: #eef3ff;
}

.role {
	font-size: 12px;
	font-weight: 700;
	color: #4c4f69;
	margin-bottom: 6px;
}

.body {
	overflow-wrap: anywhere;
	word-break: break-word;
	color: #4c4f69;
}

.body p,
.body ul,
.body pre,
.body h1,
.body h2,
.body h3,
.body h4,
.body h5,
.body h6 {
	margin: 0 0 8px 0;
}

.body > :last-child {
	margin-bottom: 0;
}

.body h1,
.body h2,
.body h3,
.body h4,
.body h5,
.body h6 {
	line-height: 1.35;
}

.body h1 {
	font-size: 1.5em;
}

.body h2 {
	font-size: 1.17em;
}

.body h3 {
	font-size: 1em;
}

.body h4 {
	font-size: .83em;
}

.body h5,
.body h6 {
	font-size: .67em;
}

.body ul {
	padding-left: 20px;
}

.body code {
	font-family: Consolas, "Courier New", monospace;
	background: #cfd1d7;
	border-radius: 4px;
	padding: 1px 4px;
	overflow-wrap: anywhere;
	word-break: break-word;
}

.body .code-block {
	position: relative;
	margin: 0 0 8px 0;
}

.body pre {
	overflow: auto;
	background: #ccd0da;
	border-radius: 6px;
	padding: 10px;
	white-space: pre-wrap;
	word-break: break-word;
	overflow-wrap: anywhere;
}

.body pre code {
	background: transparent;
	padding: 0;
	border-radius: 0;
}

.body .markdown-table-wrap {
	max-width: 100%;
	overflow-x: auto;
	margin: 0 0 8px 0;
	border: 1px solid var(--al-soft-border, #ccd3dd);
	border-radius: 6px;
	background: var(--al-panel-bg, #ffffff);
}

.body table {
	width: max-content;
	min-width: 100%;
	border-collapse: collapse;
	font-size: 12px;
	line-height: 1.5;
}

.body th,
.body td {
	min-width: 72px;
	max-width: 420px;
	padding: 7px 9px;
	border-right: 1px solid var(--al-soft-border, #ccd3dd);
	border-bottom: 1px solid var(--al-soft-border, #ccd3dd);
	text-align: left;
	vertical-align: top;
	white-space: normal;
	word-break: normal;
	overflow-wrap: anywhere;
}

.body th {
	background: var(--al-button-hover-bg, #eef1f6);
	font-weight: 700;
}

.body th:last-child,
.body td:last-child {
	border-right: 0;
}

.body tbody tr:last-child td {
	border-bottom: 0;
}

.body th.markdown-align-center,
.body td.markdown-align-center {
	text-align: center;
}

.body th.markdown-align-right,
.body td.markdown-align-right {
	text-align: right;
}

.plan-card {
	border: 1px solid #b9cffb;
	background: #f7faff;
	border-radius: 8px;
	padding: 10px;
	box-sizing: border-box;
}

.plan-card-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;
	margin-bottom: 8px;
	font-size: 12px;
	font-weight: 700;
	color: #1f2937;

.plan-status {

.plan-content {

.plan-step.completed .plan-step-status {

.plan-step.in-progress .plan-step-status {

.plan-card-actions {

.plan-user-input-card {

.plan-user-input-head {

}

.plan-user-input-progress {

}

.plan-user-input-question {

	padding: 0;

.plan-user-input-question[hidden] {

.plan-user-input-question legend {

.plan-user-input-prompt {

.plan-user-input-option {

.plan-user-input-option:hover {

.plan-user-input-option input {

}

.plan-user-input-option span {

}

.plan-user-input-option b,
.plan-user-input-answer b {

}

.plan-user-input-option small {

	line-height: 1.45;
	font-weight: 400;

.plan-user-input-note {

	max-height: 120px;

	border-radius: 6px;
	background: #ffffff;

}

.plan-user-input-note:focus {

}

.plan-user-input-answer {
	display: grid;
	gap: 3px;
	margin-top: 7px;
	border-left: 3px solid #1e66f5;
	padding: 5px 8px;
	overflow-wrap: anywhere;
}

.plan-user-input-answer span {
	font-size: 11px;
	color: #5d6475;
}

.plan-user-input-error {
	margin-top: 9px;
	color: #b42318;
	font-size: 11px;
}

.plan-user-input-actions {
	display: flex;
	align-items: center;
	gap: 8px;
	justify-content: flex-end;
	position: sticky;
	bottom: 0;
	z-index: 2;
	margin-top: 10px;
	padding-top: 4px;
	background: inherit;
}

.plan-user-input-previous {
	margin-right: auto;
}

.plan-user-input-actions [hidden] {
	display: none;
}

.body a {
	color: #0b63c9;
	text-decoration: none;
}

.body a:hover {
	text-decoration: underline;
}

.ai-config-callout .body p:last-child {
	margin-bottom: 0;
}

.inline-actions {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-top: 10px;
}

.clear-confirm {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 8px;
	border: 1px solid #f0c6c1;
	background: #fff7f6;
	border-radius: 6px;
	padding: 7px 8px;
	box-sizing: border-box;
}

.clear-confirm[hidden] {
	display: none;
}

.clear-confirm-text {
	flex: 1 1 auto;
	min-width: 0;
	font-size: 12px;
	color: #374151;
	overflow-wrap: anywhere;
	word-break: break-word;
}

.clear-confirm-actions {
	flex: 0 0 auto;
	display: flex;
	align-items: center;
	gap: 6px;
	margin-left: auto;
}

.tool-approval {
	border: 1px solid #b9c4d6;
	background: #fff;
	border-radius: 8px;
	box-shadow: 0 10px 26px rgba(15, 23, 42, .14);
	padding: 10px;
	box-sizing: border-box;
}

.tool-approval[hidden] {
	display: none;
}

.tool-approval-head {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 8px;
}

.tool-approval-title {
	font-size: 13px;
	font-weight: 700;
	line-height: 1.35;
	color: #1f2937;
}

.tool-approval-tool {
	flex: 0 0 auto;
	border: 1px solid #d7dce6;
	border-radius: 5px;
	background: #f4f6fa;
	color: #4c4f69;
	padding: 2px 7px;
	font: 10px/1.2 Consolas, "Courier New", monospace;
}

.tool-approval-meta {
	display: grid;
	grid-template-columns: auto 1fr;
	gap: 3px 8px;
	margin-bottom: 8px;
	font-size: 11px;
	color: #5d6475;
}

.tool-approval-meta b {
	color: #374151;
	font-weight: 700;
}

.tool-approval-preview {
	max-height: 280px;
	overflow: auto;
	border: 1px solid #d7dce6;
	border-radius: 6px;
	background: #f7f9fc;
	margin: 0;
	padding: 10px 12px;
	font-family: "Cascadia Mono", "Cascadia Code", Consolas, "JetBrains Mono", "SF Mono", "Courier New", monospace;
	font-size: 12px;
	line-height: 1.6;
	white-space: pre;
	overflow-wrap: normal;
	word-break: normal;
	color: #374151;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	text-rendering: optimizeLegibility;
	font-variant-ligatures: none;
}

.tool-approval-preview > div {
	width: max-content;
	min-width: 100%;
	box-sizing: border-box;
}

.tool-approval-preview .diff-add {
	color: #1b7f37;
}

.tool-approval-preview .diff-del {
	color: #b42318;
}

.tool-approval-preview .diff-hunk {
	color: #1e66f5;
	font-weight: 700;
}

.tool-approval-actions {
	display: flex;
	flex-wrap: wrap;
	justify-content: flex-end;
	gap: 8px;
	margin-top: 10px;
}

.btn.danger {
	background: #b42318;
	border-color: #b42318;
	color: #fff;
}

.btn.danger:hover {
	background: #9a1d14;
	border-color: #9a1d14;
}

.muted {
	color: #6b7280;
}

.session-menu {
	position: absolute;
	top: 34px;
	right: 8px;
	width: 320px;
	max-height: 280px;
	overflow: auto;
	background: #fff;
	border: 1px solid #d6d6d6;
	border-radius: 8px;
	box-shadow: 0 10px 28px rgba(15, 23, 42, .14);
	padding: 6px;
	box-sizing: border-box;
	z-index: 10;
}

.session-menu[hidden] {
	display: none;
}

.session-item,
.session-empty {
	display: block;
	width: 100%;
	text-align: left;
	border: 0;
	background: transparent;
	border-radius: 6px;
	padding: 8px;
	box-sizing: border-box;
}

.session-item {
	cursor: pointer;
}

.session-item:hover {
	background: #f3f6fb;
}

.session-item-time {
	font-size: 11px;
	color: #6b7280;
	margin-bottom: 3px;
}

.session-item-title {
	font-size: 12px;
	color: #1f2937;
	line-height: 1.45;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.session-empty {
	font-size: 12px;
	color: #6b7280;
}

.page-msgbox {
	position: absolute;
	left: 10px;
	right: 10px;
	bottom: 58px;
	max-width: 480px;
	margin: 0 auto;
	background: #fff;
	border: 1px solid #d6d6d6;
	border-radius: 8px;
	box-shadow: 0 12px 30px rgba(15, 23, 42, .18);
	padding: 10px;
	box-sizing: border-box;
	z-index: 12;
}

.page-msgbox[hidden] {
	display: none;
}

.page-msgbox-title {
	font-size: 13px;
	font-weight: 700;
	color: #1f2937;
	margin-bottom: 4px;
}

.page-msgbox-text {
	font-size: 12px;
	line-height: 1.45;
	color: #374151;
	overflow-wrap: anywhere;
	word-break: break-word;
}

.page-msgbox-actions {
	display: flex;
	justify-content: flex-end;
	gap: 8px;
	margin-top: 10px;
}

:root {

	--al-subtle-text: #9aa0b0;
	--al-brand: #8839ef;
	--al-primary: #1e66f5;
	--al-primary-hover: #1554d1;
	--al-accent: #04a5e5;
	--al-success: #2e7d32;
	--al-warning: #8a5a00;
	--al-danger: #b42318;
	--al-border: #d7dbe3;
	--al-soft-border: #ccd3dd;
	--al-panel-bg: #ffffff;
	--al-toolbar-bg: #e6e9ef;
	--al-composer-bg: #e6e9ef;
	--al-input-bg: #ffffff;
	--al-input-border: #d4d9e3;
	--al-button-bg: #ffffff;
	--al-button-hover-bg: #eef1f6;

	--al-tool-msg-bg: #e6e9ef;
	--al-plan-msg-bg: #eef3ff;
	--al-role-text: #4c4f69;
	--al-body-text: #4c4f69;
	--al-link-text: #0b63c9;
	--al-inline-code-bg: #cfd1d7;
	--al-code-block-bg: #ccd0da;
	--al-code-text: #1f2937;
	--al-plan-bg: #f7faff;
	--al-plan-border: #b9cffb;
	--al-plan-text: #374151;
	--al-chip-bg: #dce9ff;
	--al-approval-bg: #ffffff;
	--al-diff-bg: #f7f9fc;
	--al-diff-add: #1b7f37;
	--al-diff-del: #b42318;
	--al-placeholder: #9ca3b4;
}

html,
body,
.history-pane,
.history,
#chat-root {
	background: var(--al-page-bg);
	color: var(--al-text);
}

.topbar {
	background: var(--al-toolbar-bg);
	border-bottom: 1px solid var(--al-border);
}
.topbar-brand { color: var(--al-brand); }

	color: var(--al-panel-bg);
}
.empty-state-title {
	background: linear-gradient(110deg, var(--al-brand) 0%, var(--al-primary) 42%, var(--al-accent) 78%, var(--al-brand) 100%);
	background-size: 220% auto;
	-webkit-background-clip: text;
	background-clip: text;
}
.top-action,
.btn,
.msg,
.role,
.body,
.page-msgbox,
.session-menu { color: var(--al-text); }
.mode-chip,
.muted,
.session-item-time,
.session-empty,
.tool-approval-meta { color: var(--al-muted-text); }
.top-action:hover,
.send-icon-btn,
.stop-icon-btn,
.body a,
.empty-state-links a,
.news-config-text-title { color: var(--al-link-text); }
.top-action.active,
.mode-chip.active,
.session-status.working,
.plan-status {
	background: var(--al-chip-bg);
	color: var(--al-primary);
}
.top-action:focus-visible,
.mode-chip:focus-visible,
.send-icon-btn:focus-visible,
.stop-icon-btn:focus-visible {
	outline-color: var(--al-primary);
}
.mode-chip:hover { color: var(--al-muted-text); }
.mode-chip.active,
.session-status.working {
	border-color: var(--al-primary);
}
.session-status.done {
	background: var(--al-chip-bg);
	border-color: var(--al-success);
}
.news-config-text {
	background: var(--al-panel-bg);
	border-color: var(--al-soft-border);
	color: var(--al-text);
}
.empty-state-links a {

	border-color: rgba(30, 102, 245, .26);

.empty-state-links a:hover {
	background: var(--al-primary);
	border-color: var(--al-primary);
	color: #fff;
}
.composer {
	background: var(--al-composer-bg);
	border-top-color: var(--al-border);
}
#chat-input {
	background: var(--al-input-bg);

	color: var(--al-text);
}
#chat-input::placeholder { color: var(--al-placeholder); }
#chat-input:focus {
	border-color: var(--al-primary);

.btn {

	border-color: var(--al-soft-border);
	color: var(--al-text);
}
.btn:hover {
	background: var(--al-button-hover-bg);
	border-color: var(--al-border);
}
.btn.primary {
	background: var(--al-primary);
	border-color: var(--al-primary);
	color: var(--al-panel-bg);
}
.btn.primary:hover {
	background: var(--al-primary-hover);
	border-color: var(--al-primary-hover);
}
.btn.danger {
	background: var(--al-danger);
	border-color: var(--al-danger);

.btn.danger:hover {

.msg { border-bottom-color: var(--al-border); }
.msg.user { background: var(--al-user-msg-bg); }
.latest-user-float {

.msg.assistant { background: var(--al-assistant-msg-bg); }
.msg.tool { background: var(--al-tool-msg-bg); }
.msg.system { background: var(--al-system-msg-bg); }
.plan-message { background: var(--al-plan-msg-bg); }
.role { color: var(--al-role-text); }
.body { color: var(--al-body-text); }
.body code { background: var(--al-inline-code-bg); }

.body pre code { color: var(--al-code-text); }
.copy-code-btn {

	background: var(--al-button-bg);

.copy-code-btn:hover {

.copy-code-btn.copied {
	background: var(--al-primary);

.plan-card {

.plan-user-input-card {

.plan-user-input-progress {

.plan-user-input-question legend,

	color: var(--al-muted-text);

.plan-user-input-option,

	background: var(--al-input-bg);

.plan-user-input-option:hover {

.plan-user-input-error {

.tool-call-status.ok {
	background: var(--al-chip-bg);

.tool-call-status.failed {

.session-status,
.api-profile-menu {

}

.tool-approval-meta b {

}
.session-status.done,
.mode-chip.auto.active { color: var(--al-success); }

<script>
window.autolinkerBusy = false;
window.autolinkerPlanState = "normal";
window.autolinkerAutoAllow = false;
window.autolinkerGoalState = { status: "none", objective: "", tokensUsed: 0, elapsedLabel: "0m 0s", label: "\u76EE\u6807" };
window.autolinkerGoalPanelOpen = false;
window.autolinkerApiProfiles = { activeProfileId: "", activeProfileName: "\u672A\u914D\u7F6E", profiles: [], pendingForNextRequest: false };
window.autolinkerContextUsageTitle = "\u4E0A\u4E0B\u6587\u7528\u91CF\u4E0D\u53EF\u7528";

window.autolinkerSetPageVisible = function(visible) {
	document.documentElement.classList.toggle("autolinker-page-visible", !!visible);
};

window.autolinkerEscapeHtml = function(text) {
	return String(text || "")
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/\"/g, "&quot;")
		.replace(/'/g, "&#39;");
};

window.autolinkerApplyTheme = function(theme) {
	var colors = theme && theme.colors ? theme.colors : {};
	var map = {
		pageBg: "--al-page-bg",
		text: "--al-text",
		mutedText: "--al-muted-text",
		subtleText: "--al-subtle-text",
		brand: "--al-brand",
		primary: "--al-primary",
		primaryHover: "--al-primary-hover",
		accent: "--al-accent",
		success: "--al-success",
		warning: "--al-warning",
		danger: "--al-danger",
		border: "--al-border",
		softBorder: "--al-soft-border",
		panelBg: "--al-panel-bg",
		toolbarBg: "--al-toolbar-bg",
		composerBg: "--al-composer-bg",
		inputBg: "--al-input-bg",
		inputBorder: "--al-input-border",
		buttonBg: "--al-button-bg",
		buttonHoverBg: "--al-button-hover-bg",
		userMsgBg: "--al-user-msg-bg",
		assistantMsgBg: "--al-assistant-msg-bg",
		systemMsgBg: "--al-system-msg-bg",
		toolMsgBg: "--al-tool-msg-bg",
		planMsgBg: "--al-plan-msg-bg",
		roleText: "--al-role-text",
		bodyText: "--al-body-text",
		linkText: "--al-link-text",
		inlineCodeBg: "--al-inline-code-bg",
		codeBlockBg: "--al-code-block-bg",
		codeText: "--al-code-text",
		planBg: "--al-plan-bg",
		planBorder: "--al-plan-border",
		planText: "--al-plan-text",
		chipBg: "--al-chip-bg",
		approvalBg: "--al-approval-bg",
		diffBg: "--al-diff-bg",
		diffAdd: "--al-diff-add",
		diffDel: "--al-diff-del",
		placeholder: "--al-placeholder"
	};
	var root = document.documentElement;
	for (var key in map) {
		if (Object.prototype.hasOwnProperty.call(map, key) && colors[key]) {
			root.style.setProperty(map[key], colors[key]);
		}
	}
	var pageBg = String(colors.pageBg || "");
	var match = /^#([0-9a-f]{6})$/i.exec(pageBg);
	if (match) {
		var value = parseInt(match[1], 16);
		var red = (value >> 16) & 255;
		var green = (value >> 8) & 255;
		var blue = value & 255;
		root.style.colorScheme = ((red * 299 + green * 587 + blue * 114) / 1000) < 128 ? "dark" : "light";
	}
};

window.autolinkerLatestUserFloatFrame = 0;

window.autolinkerUpdateLatestUserFloat = function() {
	var root = document.getElementById("chat-root");
	var scroll = document.getElementById("history-scroll");
	var floating = document.getElementById("latest-user-float");
	if (!root || !scroll || !floating || !root.querySelectorAll) {
		return;
	}

	var users = root.querySelectorAll(".msg.user");
	var latest = users.length ? users[users.length - 1] : null;
	if (!latest) {
		floating.hidden = true;
		floating.textContent = "";
		floating.removeAttribute("title");
		return;
	}

	var viewportRect = scroll.getBoundingClientRect();
	var messageRect = latest.getBoundingClientRect();
	var visibleHeight = Math.min(messageRect.bottom, viewportRect.bottom) - Math.max(messageRect.top, viewportRect.top);
	if (visibleHeight > 1) {
		floating.hidden = true;
		return;
	}

	var body = latest.querySelector ? latest.querySelector(".body") : null;
	var text = String(body ? (body.textContent || "") : (latest.textContent || ""))
		.replace(/\s+/g, " ")
		.trim();
	if (!text) {
		floating.hidden = true;
		floating.textContent = "";
		floating.removeAttribute("title");
		return;
	}

	floating.textContent = text;
	floating.title = text;
	floating.hidden = false;
};

window.autolinkerScheduleLatestUserFloat = function() {
	if (window.autolinkerLatestUserFloatFrame) {
		return;
	}
	window.autolinkerLatestUserFloatFrame = window.requestAnimationFrame(function() {
		window.autolinkerLatestUserFloatFrame = 0;
		window.autolinkerUpdateLatestUserFloat();
	});
};

window.autolinkerShowPlanUserInputQuestion = function(card, requestedIndex, focusInput) {
	if (!card || !card.querySelectorAll) {
		return;
	}
	var questions = card.querySelectorAll(".plan-user-input-question");
	if (!questions.length) {
		return;
	}
	var index = Number(requestedIndex);
	if (!isFinite(index)) {
		index = 0;
	}
	index = Math.max(0, Math.min(questions.length - 1, Math.floor(index)));
	card.setAttribute("data-current-question-index", String(index));
	for (var i = 0; i < questions.length; i++) {
		questions[i].hidden = i !== index;
	}

	var progress = card.querySelector(".plan-user-input-progress");
	if (progress) {
		progress.textContent = "(" + (index + 1) + "/" + questions.length + ")";
	}
	var previous = card.querySelector("[data-plan-user-input-action='previous']");
	var next = card.querySelector("[data-plan-user-input-action='next']");
	var submit = card.querySelector("[data-plan-user-input-action='submit']");
	if (previous) {
		previous.hidden = index === 0;
	}
	if (next) {
		next.hidden = index >= questions.length - 1;
	}
	if (submit) {
		submit.hidden = index < questions.length - 1;
	}
	var error = card.querySelector(".plan-user-input-error");
	if (error) {
		error.hidden = true;
		error.textContent = "";
	}

	var question = questions[index];
	if (focusInput) {
		var target = question.querySelector("input[type='radio']:checked") ||
			question.querySelector("input, textarea");
		if (target) {
			target.focus();
		}
	}
	window.requestAnimationFrame(function() {
		var scroll = document.getElementById("history-scroll");
		if (!scroll || !question.getBoundingClientRect) {
			return;
		}
		var scrollRect = scroll.getBoundingClientRect();
		var questionRect = question.getBoundingClientRect();
		var head = card.querySelector(".plan-user-input-head");
		var headHeight = head ? head.getBoundingClientRect().height : 0;
		scroll.scrollTop += questionRect.top - scrollRect.top - headHeight;
	});
};

window.autolinkerInitializePlanUserInputCards = function(root) {
	if (!root || !root.querySelectorAll) {
		return;
	}
	var cards = root.querySelectorAll(".plan-user-input-card.active");
	for (var i = 0; i < cards.length; i++) {
		window.autolinkerShowPlanUserInputQuestion(
			cards[i],
			cards[i].getAttribute("data-current-question-index") || "0",
			false);
	}
};

window.autolinkerSetChatHtml = function(html) {
	var root = document.getElementById("chat-root");
	var scroll = document.getElementById("history-scroll");
	if (root) {
		root.innerHTML = html || "";
		var planButtons = root.querySelectorAll ? root.querySelectorAll(".plan-action") : [];
		for (var i = 0; i < planButtons.length; i++) {
			planButtons[i].disabled = !!window.autolinkerBusy;
		}
		window.autolinkerInitializePlanUserInputCards(root);
		window.autolinkerAwaitingPlanUserInput = !!(root.querySelector && root.querySelector(".plan-user-input-card.active"));
		if (typeof window.autolinkerSetBusy === "function") {
			window.autolinkerSetBusy(!!window.autolinkerBusy, !!window.autolinkerStopRequested);
		}
		if (scroll) {
			scroll.scrollTop = scroll.scrollHeight;
		}
		window.autolinkerScheduleLatestUserFloat();
	}
};

window.autolinkerSetUpdateTag = function(show) {
	var tag = document.getElementById("update-tag");
	if (tag) {
		tag.hidden = !show;
	}
};

window.autolinkerSetPlanMode = function(state, label, title) {
	var normalized = state || "normal";
	window.autolinkerPlanState = normalized;
	var active = normalized === "planning" || normalized === "awaiting_approval";
	var btn = document.getElementById("plan-mode-btn");
	if (btn) {
		var text = btn.querySelector ? btn.querySelector(".mode-label") : null;
		if (text) {
			text.textContent = "\u8BA1\u5212";
		}
		btn.classList.toggle("active", active);
		btn.title = title || (active ? "\u9000\u51FA\u8BA1\u5212\u6A21\u5F0F" : "\u8FDB\u5165\u8BA1\u5212\u6A21\u5F0F");
		btn.setAttribute("aria-label", btn.title);
	}
	if (window.autolinkerApplyGoalButtonState) {
		window.autolinkerApplyGoalButtonState();
	}
	window.autolinkerRenderGoalPanel();
};

window.autolinkerSetAutoAllowMode = function(enabled, label, title) {
	var active = !!enabled;
	window.autolinkerAutoAllow = active;
	var btn = document.getElementById("auto-allow-btn");
	if (!btn) {
		return;
	}
	var text = btn.querySelector ? btn.querySelector(".mode-label") : null;
	if (text) {
		text.textContent = "\u81EA\u52A8\u5141\u8BB8";
	}
	btn.classList.toggle("active", active);
	btn.title = title || (active ? "\u81EA\u52A8\u5141\u8BB8\u5199\u5165" : "\u9ED8\u8BA4\u8BE2\u95EE\u5199\u5165");
	btn.setAttribute("aria-label", btn.title);
};

window.autolinkerRenderApiProfiles = function() {
	var data = window.autolinkerApiProfiles || {};
	var profiles = Array.isArray(data.profiles) ? data.profiles : [];
	var activeName = data.activeProfileName || "\u672A\u914D\u7F6E";
	var btn = document.getElementById("api-profile-btn");
	var menu = document.getElementById("api-profile-menu");
	if (btn) {
		var label = btn.querySelector ? btn.querySelector(".mode-label") : null;
		if (label) label.textContent = activeName;
		btn.title = "\u5F53\u524D API\uFF1A" + activeName + (data.pendingForNextRequest ? "\uFF08\u4E0B\u6B21\u8BF7\u6C42\u751F\u6548\uFF09" : "");
		btn.setAttribute("aria-label", profiles.length ? "\u5207\u6362 API \u914D\u7F6E\uFF0C\u5F53\u524D\u4E3A " + activeName : "\u6253\u5F00 AI \u670D\u52A1\u8BBE\u7F6E");
	}
	if (!menu) return;
	var html = "";
	for (var i = 0; i < profiles.length; i++) {
		var profile = profiles[i] || {};
		var selected = String(profile.id || "") === String(data.activeProfileId || "");
		html += '<button class="api-profile-item" type="button" role="menuitemradio" aria-checked="' + (selected ? "true" : "false") + '" data-api-profile-id="' + window.autolinkerEscapeHtml(profile.id || "") + '" title="' + window.autolinkerEscapeHtml(profile.name || "") + '">';
		html += '<span class="api-profile-check">' + (selected ? "\u2713" : "") + '</span>';
		html += '<span class="api-profile-item-name">' + window.autolinkerEscapeHtml(profile.name || "") + '</span></button>';
	}
	menu.innerHTML = html;
};

window.autolinkerSetApiProfiles = function(payload) {
	window.autolinkerApiProfiles = payload || { activeProfileId: "", activeProfileName: "\u672A\u914D\u7F6E", profiles: [], pendingForNextRequest: false };
	window.autolinkerRenderApiProfiles();
};

window.autolinkerRenderGoalPanel = function() {
	var panel = document.getElementById("goal-panel");
	if (!panel) return;
	if (!window.autolinkerGoalPanelOpen) {
		panel.hidden = true;
		panel.innerHTML = "";
		return;
	}
	var data = window.autolinkerGoalState || {};
	var status = data.status || "none";
	var html = '<div class="goal-panel-head"><div class="goal-panel-title">' + window.autolinkerEscapeHtml(data.label || "\u76EE\u6807") + '</div>';
	if (status !== "none") {
		html += '<div class="goal-panel-meta">';
		if (data.suspendedByPlan) html += '<span>\u8BA1\u5212\u6A21\u5F0F\u4E2D\u5DF2\u6682\u6302</span>';
		html += '<span>' + window.autolinkerEscapeHtml(data.elapsedLabel || "0m 0s") + '</span><span>' + Number(data.tokensUsed || 0) + ' tokens</span></div>';
	}
	html += '</div>';
	if (status === "none") {
		html += '<textarea id="goal-objective" class="goal-objective" maxlength="8000" placeholder="\u76EE\u6807"></textarea>';
		html += '<div class="goal-panel-actions"><button class="btn" type="button" data-goal-action="cancel">\u53D6\u6D88</button><button class="btn primary" type="button" data-goal-action="create">\u5F00\u542F</button></div>';
	} else {
		html += '<div class="goal-objective-view">' + window.autolinkerEscapeHtml(data.objective || "") + '</div>';
		html += '<div class="goal-panel-actions">';
		if (status === "active") html += '<button class="btn" type="button" data-goal-action="pause">\u6682\u505C</button>';

window.autolinkerApplyGoalButtonState = function() {

		(planState === "planning" || planState === "awaiting_approval");
	data.suspendedByPlan = suspendedByPlan;
	var btn = document.getElementById("goal-mode-btn");

	if (text) text.textContent = suspendedByPlan ? "\u76EE\u6807" : (data.label || "\u76EE\u6807");
	btn.classList.toggle("active", !suspendedByPlan && status === "active");
	btn.classList.toggle("paused", !suspendedByPlan && status === "paused");
	btn.classList.toggle("blocked", !suspendedByPlan && status === "blocked");
	btn.classList.toggle("complete", !suspendedByPlan && status === "complete");
	btn.title = suspendedByPlan
		? "Goal \u5DF2\u5728\u8BA1\u5212\u6A21\u5F0F\u4E2D\u6682\u6302"
		: (data.objective || data.label || "\u76EE\u6807");

window.autolinkerSetBusy = function(busy, stopRequested) {
	var send = document.getElementById("send-btn");
	var stop = document.getElementById("stop-btn");
	var newSession = document.getElementById("new-session-btn");
	var restore = document.getElementById("restore-btn");
	var settings = document.getElementById("settings-btn");
	var mcpSettings = document.getElementById("mcp-settings-btn");
	var skillSettings = document.getElementById("skill-settings-btn");
	var planMode = document.getElementById("plan-mode-btn");
	var autoAllow = document.getElementById("auto-allow-btn");
	var goalMode = document.getElementById("goal-mode-btn");
	var clearConfirm = document.getElementById("clear-confirm");
	var restoreConfirm = document.getElementById("restore-confirm");
	var input = document.getElementById("chat-input");
	var isBusy = !!busy;
	var isStopping = !!stopRequested;
	var waitingForPlanInput = !!window.autolinkerAwaitingPlanUserInput;
	window.autolinkerBusy = isBusy;
	window.autolinkerStopRequested = isStopping;
	if (send) {
		send.disabled = waitingForPlanInput;
		send.style.display = "";
		send.style.right = isBusy ? "42px" : "8px";
	}
	if (stop) {
		stop.disabled = !isBusy || isStopping;
		stop.title = isStopping ? "\u505C\u6B62\u4E2D..." : "\u505C\u6B62";
		stop.style.display = isBusy ? "" : "none";
	}
	if (newSession) {
		newSession.disabled = isBusy;
	}
	if (restore) {
		restore.disabled = isBusy;
	}
	if (settings) {
		settings.disabled = isBusy;
	}
	if (mcpSettings) {
		mcpSettings.disabled = isBusy;
	}
	if (skillSettings) {
		skillSettings.disabled = isBusy;
	}
	if (planMode) {
		planMode.disabled = isBusy;
	}
	if (autoAllow) {
		autoAllow.disabled = false;
	}
	if (goalMode) {
		goalMode.disabled = false;
	}
	if (input) {
		input.disabled = waitingForPlanInput;
		input.style.paddingRight = isBusy ? "76px" : "44px";
	}
	var planButtons = document.querySelectorAll ? document.querySelectorAll(".plan-action") : [];
	for (var i = 0; i < planButtons.length; i++) {
		planButtons[i].disabled = isBusy;
	}
	if (isBusy) {
		var sessionMenu = document.getElementById("session-menu");
		if (sessionMenu) {
			sessionMenu.hidden = true;
		}
		if (clearConfirm) {
			clearConfirm.hidden = true;
		}
		if (restoreConfirm) {
			restoreConfirm.hidden = true;
		}
	}
};

window.autolinkerResizeChatInput = function(input) {
	if (!input) {
		return;
	}
	var maxHeight = 220;
	var minHeight = 60;
	input.style.height = "auto";
	var nextHeight = Math.max(minHeight, Math.min(input.scrollHeight, maxHeight));
	input.style.height = nextHeight + "px";
	input.style.overflowY = input.scrollHeight > maxHeight ? "auto" : "hidden";
};

window.autolinkerClearInput = function() {

		window.autolinkerResizeChatInput(input);

window.autolinkerRenderDiffPreview = function(text) {
	var lines = String(text || "").split(/\r?\n/);
	var html = "";
	for (var i = 0; i < lines.length; i++) {
		var line = lines[i];
		var cls = "";
		if (line.indexOf("@@") === 0) {
			cls = "diff-hunk";
		} else if (line.indexOf("+") === 0) {
			cls = "diff-add";
		} else if (line.indexOf("-") === 0) {
			cls = "diff-del";
		}
		html += '<div' + (cls ? ' class="' + cls + '"' : "") + '>' + window.autolinkerEscapeHtml(line || " ") + '</div>';
	}
	return html;
};

window.autolinkerShowToolApproval = function(payload) {

	var tool = data.tool || "tool";

	var filePath = data.file_path || data.mapped_page_name || "";
	var pageName = data.page_name || data.mapped_page_name || "";
	var previewKind = data.preview_kind || "arguments";
	var previewText = data.preview_text || "";

	html += '<div class="tool-approval-head">';

	html += '<div class="tool-approval-tool">' + window.autolinkerEscapeHtml(tool) + '</div>';
	html += '</div>';

		html += '<b>\u76ee\u6807</b><span>' + window.autolinkerEscapeHtml(filePath) + '</span>';

		}
		return new Promise(function(resolve, reject) {
			var area = document.createElement("textarea");
			area.value = text || "";
			area.setAttribute("readonly", "readonly");
			area.style.position = "fixed";
			area.style.left = "-9999px";
			document.body.appendChild(area);
			area.select();
			try {
				if (document.execCommand("copy")) {
					resolve();
				} else {
					reject(new Error("copy failed"));
				}
			} catch (err) {
				reject(err);
			} finally {
				document.body.removeChild(area);

	if (restoreCancelBtn) {

				input.focus();

	}

	function readPlanUserInputAnswer(question) {

			? question.querySelector(".plan-user-input-note")
			: null;
		var noteText = note ? (note.value || "").trim() : "";
		var label = selected ? (selected.getAttribute("data-option-label") || "") : "";
		return {
			valid: !!selected && (label !== "" || noteText !== ""),
			id: question ? (question.getAttribute("data-question-id") || "") : "",
			label: label,
			note: noteText,
			selected: selected,
			noteInput: note
		};
	}

	function showPlanUserInputValidationError(card, question, questionIndex) {
		window.autolinkerShowPlanUserInputQuestion(card, questionIndex, false);
		var error = card.querySelector ? card.querySelector(".plan-user-input-error") : null;
		if (error) {
			error.textContent = "\u8bf7\u9009\u62e9\u4e00\u4e2a\u9009\u9879\uff1b\u9009\u62e9\u5176\u4ed6\u65f6\u9700\u8981\u586b\u5199\u5185\u5bb9\u3002";
			error.hidden = false;
		}
		var answer = readPlanUserInputAnswer(question);
		var target = answer.selected && !answer.label && !answer.note
			? answer.noteInput
			: (answer.selected || (question.querySelector ? question.querySelector("input, textarea") : null));
		if (target) {
			target.focus();

	document.addEventListener("click", function(e) {
		var apiProfileItem = e.target && e.target.closest ? e.target.closest("[data-api-profile-id]") : null;
		if (apiProfileItem) {
			e.preventDefault();
			var profileId = apiProfileItem.getAttribute("data-api-profile-id") || "";
			hideApiProfileMenu();
			if (profileId) post({ action: "switch_api_profile", profileId: profileId });

				if (!objectiveText) {
					if (objective) objective.focus();

				return;
			}
			if (action === "pause") post({ action: "pause_goal" });
			else if (action === "resume") post({ action: "resume_goal" });
			else if (action === "complete") post({ action: "complete_goal" });
			else if (action === "clear") {
				window.autolinkerGoalPanelOpen = false;
				post({ action: "clear_goal" });
			}
			return;
		}
		var planUserInputBtn = e.target && e.target.closest ? e.target.closest("[data-plan-user-input-action]") : null;
		if (planUserInputBtn) {
			e.preventDefault();
			var card = planUserInputBtn.closest ? planUserInputBtn.closest(".plan-user-input-card.active") : null;
			if (!card) {
				return;
			}
			var questions = card.querySelectorAll ? card.querySelectorAll(".plan-user-input-question") : [];
			var planUserInputAction = planUserInputBtn.getAttribute("data-plan-user-input-action") || "";
			var currentQuestionIndex = Number(card.getAttribute("data-current-question-index") || "0");
			if (!isFinite(currentQuestionIndex)) {
				currentQuestionIndex = 0;
			}
			currentQuestionIndex = Math.max(0, Math.min(questions.length - 1, Math.floor(currentQuestionIndex)));
			if (planUserInputAction === "previous") {
				window.autolinkerShowPlanUserInputQuestion(card, currentQuestionIndex - 1, true);
				return;
			}
			if (planUserInputAction === "next") {
				var currentAnswer = readPlanUserInputAnswer(questions[currentQuestionIndex]);
				if (!currentAnswer.valid) {
					showPlanUserInputValidationError(card, questions[currentQuestionIndex], currentQuestionIndex);
					return;
				}
				window.autolinkerShowPlanUserInputQuestion(card, currentQuestionIndex + 1, true);
				return;
			}
			if (planUserInputAction !== "submit") {
				return;
			}
			var answers = [];
			var invalidQuestionIndex = -1;
			for (var questionIndex = 0; questionIndex < questions.length; questionIndex++) {
				var question = questions[questionIndex];
				var answer = readPlanUserInputAnswer(question);
				if (!answer.valid) {
					invalidQuestionIndex = questionIndex;
					break;
				}
				answers.push({
					id: answer.id,
					label: answer.label,
					note: answer.note
				});
			}
			if (invalidQuestionIndex >= 0) {
				showPlanUserInputValidationError(card, questions[invalidQuestionIndex], invalidQuestionIndex);
				return;
			}
			var actionButtons = card.querySelectorAll ? card.querySelectorAll("[data-plan-user-input-action]") : [];
			for (var actionIndex = 0; actionIndex < actionButtons.length; actionIndex++) {
				actionButtons[actionIndex].disabled = true;
			}
			post({
				action: "submit_plan_user_input",
				id: card.getAttribute("data-plan-user-input-id") || "0",
				answers: answers
			});
			return;
		}
		var pendingBtn = e.target && e.target.closest ? e.target.closest("[data-pending-action='recall']") : null;
		if (pendingBtn) {
			e.preventDefault();
			post({ action: "recall_pending" });
			return;
		}
		var toolBtn = e.target && e.target.closest ? e.target.closest("[data-tool-action]") : null;
		if (toolBtn) {
			e.preventDefault();
			var toolAction = toolBtn.getAttribute("data-tool-action") || "";
			var approvalId = toolBtn.getAttribute("data-approval-id") || "0";
			hideSessionMenu();
			hideClearConfirm();
			hideRestoreConfirm();
			if (toolAction === "deny") {
				post({ action: "deny_tool", id: approvalId });
			} else if (toolAction === "auto") {
				post({ action: "auto_allow_tool", id: approvalId });
			} else {
				post({ action: "approve_tool", id: approvalId });
			}
			return;
		}
		var sessionBtn = e.target && e.target.closest ? e.target.closest(".session-item") : null;
		if (sessionBtn) {
			e.preventDefault();
			hideSessionMenu();
			post({ action: "restore_session", sessionId: sessionBtn.getAttribute("data-session-id") || "" });
			return;
		}
		var mcpGuideLink = e.target && e.target.closest ? e.target.closest(".mcp-guide-link") : null;
		if (mcpGuideLink) {
			e.preventDefault();
			post({ action: "open_url", url: mcpGuideLink.getAttribute("href") || "" });
			return;
		}
		var planBtn = e.target && e.target.closest ? e.target.closest(".plan-action") : null;
		if (planBtn) {
			e.preventDefault();
			hideSessionMenu();
			hideClearConfirm();
			hideRestoreConfirm();
			var planAction = planBtn.getAttribute("data-plan-action") || "";
			if (planAction === "approve") {
				post({ action: "approve_plan" });
			} else if (planAction === "revise") {
				post({ action: "revise_plan", text: input ? (input.value || "") : "" });
			} else if (planAction === "exit") {
				post({ action: "exit_plan_mode" });
			}
			return;
		}
		var copyBtn = e.target && e.target.closest ? e.target.closest(".copy-code-btn") : null;
		if (copyBtn) {
			e.preventDefault();
			var block = copyBtn.closest ? copyBtn.closest(".code-block") : null;
			var code = block && block.querySelector ? block.querySelector("pre code") : null;
			var original = copyBtn.textContent || "\u590D\u5236";
			copyText(code ? (code.textContent || "") : "").then(function() {
				copyBtn.textContent = "\u5DF2\u590D\u5236";
				copyBtn.classList.add("copied");
				setTimeout(function() {
					copyBtn.textContent = original;
					copyBtn.classList.remove("copied");
				}, 1200);
			}, function() {
				copyBtn.textContent = "\u5931\u8D25";
				setTimeout(function() {
					copyBtn.textContent = original;
				}, 1200);
			});
			return;
		}
		var actionBtn = e.target && e.target.closest ? e.target.closest("[data-chat-action='open_settings']") : null;
		if (actionBtn) {
			e.preventDefault();
			hideClearConfirm();
			hideRestoreConfirm();
			post({ action: "open_settings" });
			return;
		}
	});

	document.addEventListener("mousedown", function(e) {
		if (sessionMenu && !sessionMenu.hidden) {
			var insideMenu = sessionMenu.contains(e.target);
			var onRestoreBtn = restore && restore.contains && restore.contains(e.target);
			if (!insideMenu && !onRestoreBtn) {
				hideSessionMenu();
			}
		}
		if (apiProfileMenu && !apiProfileMenu.hidden) {
			var insideApiMenu = apiProfileMenu.contains(e.target);
			var onApiProfile = apiProfile && apiProfile.contains && apiProfile.contains(e.target);
			if (!insideApiMenu && !onApiProfile) hideApiProfileMenu();
		}
	});

	document.addEventListener("keydown", function(e) {
		if (e.key === "Escape") {
			if (apiProfileMenu && !apiProfileMenu.hidden) {
				hideApiProfileMenu();
				if (apiProfile) apiProfile.focus();
				return;
			}
			var approval = document.getElementById("tool-approval");
			if (approval && !approval.hidden) {
				var denyBtn = approval.querySelector ? approval.querySelector("[data-tool-action='deny']") : null;
				post({ action: "deny_tool", id: denyBtn ? (denyBtn.getAttribute("data-approval-id") || "0") : "0" });
				return;
			}
			if (restoreConfirm && !restoreConfirm.hidden) {
				hideRestoreConfirm();
				post({ action: "restore_cancel" });
				return;
			}
			hideClearConfirm();
		}
	});

	if (input) {
		input.addEventListener("input", function() {
			window.autolinkerResizeChatInput(input);
		});
		input.addEventListener("keydown", function(e) {
			if (e.key === "ArrowUp" && e.altKey) {
				e.preventDefault();
				post({ action: "recall_pending" });
				return;
			}
			if (e.key === "Enter" && !e.ctrlKey && !e.shiftKey) {
				e.preventDefault();
				doSend();
			}
		});
		setTimeout(function() {
			window.autolinkerResizeChatInput(input);
			if (document.documentElement.classList.contains("autolinker-page-visible")) {
				input.focus();
			}
		}, 0);
	}
})();
</script>
</body>
</html>
