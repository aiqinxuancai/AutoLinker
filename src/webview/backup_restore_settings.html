<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:"Microsoft YaHei UI","Segoe UI",Arial,sans-serif;color:#20252b;background:#fff;font-size:13px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:auto;background:#fff}.page-header{padding:12px 20px;border-bottom:1px solid #e2e8f0}.page-header-inner{display:flex;min-height:46px;align-items:center;justify-content:space-between;gap:12px}.page-title{margin:0;color:#020617;font-size:18px;font-weight:600;line-height:24px}.page-subtitle{margin:2px 0 0;color:#64748b;font-size:12px;line-height:20px}.content{padding:20px}.section{padding:0 0 22px;border-bottom:1px solid #e5e8ec}.section-title{margin:0 0 9px;font-size:15px;font-weight:650}.source{color:#59636e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;gap:8px;margin:20px 0 12px}.btn{min-height:34px;border:1px solid #c8cfd7;background:#fff;color:#303941;border-radius:4px;padding:7px 12px;cursor:pointer}.btn:hover:not(:disabled){border-color:#8fa1b2;background:#f6f8fa}.btn-primary{border-color:#236aa5;background:#2878b7;color:#fff}.btn-primary:hover:not(:disabled){border-color:#1c5b8e;background:#246da7;color:#fff}.btn:disabled{cursor:not-allowed;opacity:.48}.table-wrap{overflow:auto;border:1px solid #dfe3e8;border-radius:4px}.table{width:100%;border-collapse:collapse;min-width:580px}.table th{background:#f6f8fa;color:#59636e;font-weight:600;text-align:left}.table th,.table td{padding:10px 12px;border-bottom:1px solid #e8ebef}.table tr:last-child td{border-bottom:0}.empty{padding:28px 12px;color:#7a858f;text-align:center}.notice{min-height:24px;margin-top:14px;color:#59636e;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{color:#a23b3b}.state{display:inline-block;border-radius:4px;padding:3px 7px;background:#fff1f1;color:#993b3b;font-size:12px}.state.ok{background:#edf8f2;color:#1d704d}@media(max-width:700px){.content{padding:16px 14px}}
.tabs{display:flex;gap:8px;margin:18px 0}.tab[aria-selected="true"]{color:#236aa5;border-color:#236aa5;background:#edf5fc}button,input{font:inherit}
.options{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:20px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;margin:0}
.option-field{display:flex;flex-direction:column;gap:10px;min-width:120px}
.option-label{font-size:12px;font-weight:600;line-height:18px;color:#475569}
.switch-row{display:flex;align-items:center;gap:10px;height:36px;cursor:pointer;color:#334155}
.switch{position:relative;display:inline-flex;flex:none;width:40px;height:22px}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch-track{width:40px;height:22px;border-radius:11px;background:#cbd5e1;transition:background .15s ease}
.switch-track:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0f172a26;transition:transform .15s ease}
.switch input:checked+.switch-track{background:#2563eb}.switch input:checked+.switch-track:after{transform:translateX(18px)}
.switch input:focus-visible+.switch-track{outline:2px solid #2563eb;outline-offset:3px}.switch input:disabled{cursor:not-allowed}.switch input:disabled+.switch-track{opacity:.45}
.number-control{display:flex;align-items:center;height:36px;width:136px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.number-control:focus-within{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb1a}
.options .number-control input{min-width:0;width:100%;height:100%;border:0;outline:none;padding:0 10px;color:#0f172a;background:transparent}
.number-control .unit{padding:0 10px 0 4px;color:#64748b;white-space:nowrap;font-size:12px}
.options .save-options{height:36px;min-height:36px;margin-left:auto;padding:0 16px;border-radius:6px;border-color:#1d4ed8;background:#1d4ed8;font-weight:500;white-space:nowrap}
.options .save-options:hover:not(:disabled){background:#1e40af;border-color:#1e40af;color:#fff}
.btn:focus-visible{outline:2px solid #2563eb;outline-offset:3px}[hidden]{display:none!important}
@media(max-width:620px){.options{gap:18px 20px;padding:16px}.options .save-options{margin-left:0}.tabs{flex-wrap:wrap}.option-field{flex:1;min-width:136px}}
@media(prefers-reduced-motion:reduce){.switch-track,.switch-track:after,.number-control{transition:none}}
.hint{color:#64748b;line-height:1.6}
</style></head><body><main><header class="page-header"><div class="page-header-inner"><div><h1 class="page-title">备份与恢复</h1><p class="page-subtitle">查看对话、定时和工具写入前的源码快照，并将内容恢复到当前 IDE 工程。</p></div></div></header><div class="content"><section class="section"><h2 class="section-title">当前工程</h2><div id="source" class="source">正在读取...</div><div id="support" class="notice"></div></section><div class="tabs" role="tablist"><button class="btn tab" role="tab" data-kind="0">AI 对话</button><button class="btn tab" role="tab" data-kind="1">定时快照</button><button class="btn tab" role="tab" data-kind="2">MCP / 内部工具写入</button></div><form id="options" class="options">
  <div class="option-field">
    <span class="option-label">自动备份</span>
    <label class="switch-row" for="enabled"><span class="switch"><input id="enabled" type="checkbox"><span class="switch-track" aria-hidden="true"></span></span><span>启用备份</span></label>
  </div>
  <div class="option-field">
    <label class="option-label" for="keep">保留数量</label>
    <div class="number-control"><input id="keep" type="number" min="1" max="1000" required><span class="unit">份</span></div>
  </div>
  <div id="interval-label" class="option-field">
    <label class="option-label" for="interval">备份间隔</label>
    <div class="number-control"><input id="interval" type="number" min="1" max="1440" value="5" required><span class="unit">分钟</span></div>
  </div>
  <button class="btn btn-primary save-options" type="submit">保存设置</button>
</form><p id="hint" class="hint"></p><div class="toolbar"><button id="refresh" class="btn" type="button">刷新列表</button></div><div class="table-wrap"><table class="table"><thead><tr><th>备份时间</th><th>备份文件 / 需求摘要</th><th>大小</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">正在读取备份...</td></tr></tbody></table></div><p class="notice">恢复前会自动备份当前内容。恢复后保留原工程路径，确认内容后可手动保存。</p><div id="notice" role="status" aria-live="polite" class="notice"></div></div></main><script>
function $(id){return document.getElementById(id)}function post(action,data){if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage(JSON.stringify({action:action,...(data||{})}))}function formatSize(n){if(n<1024)return n+" 字节";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(1)+" MB"}var currentKind=0,currentData={};
function render(data){data=data||{};document.querySelectorAll("button,input").forEach(b=>b.disabled=false);
document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",Number(b.dataset.kind)===currentKind?"true":"false"));
var setting=(data.settings||[])[currentKind]||{enabled:currentKind===0,keepCount:currentKind===0?10:20};
$("enabled").checked=setting.enabled;$("keep").value=setting.keepCount;$("interval").value=data.intervalMinutes||5;$("interval-label").hidden=currentKind!==1;$("interval").disabled=currentKind!==1;
$("hint").textContent=["每次发送 AI 对话前保存快照。旧版备份也在此显示。","仅对已保存的工程定时抓取当前内容；编译、调试、工具执行或模态窗口（含设置窗口）打开期间延后。","MCP 和内部工具调用写入类方法前保存快照；读取类方法不触发。备份失败会记录日志，工具继续执行。"][currentKind]+" 三类备份独立计数，保存在同一 .BAK 文件夹。";
$("source").textContent=data.sourcePath||"当前未打开已保存的工程";$("source").title=data.sourcePath||"";$("support").innerHTML=data.supported?'<span class="state ok">支持 e5.95 内部恢复</span>':'<span class="state">无法恢复，此功能需要 e5.95 版本。</span>';var rows=$("rows");rows.textContent="";var list=(data.backups||[]).map((item,index)=>({...item,originalIndex:index})).filter(item=>(item.kind||0)===currentKind);if(!list.length){rows.innerHTML='<tr><td colspan="4" class="empty">当前工程暂无自动备份。</td></tr>'}else list.forEach(function(item,index){var tr=document.createElement("tr"),time=document.createElement("td"),name=document.createElement("td"),size=document.createElement("td"),action=document.createElement("td"),button=document.createElement("button");time.textContent=item.timestamp||"";name.textContent=item.name||"";size.textContent=formatSize(Number(item.size)||0);button.className="btn btn-primary restore";button.type="button";button.textContent="恢复";button.disabled=!data.supported||!data.canRestore;button.onclick=function(){if(confirm("恢复前会自动保存当前内容，确定恢复此备份吗？")){document.querySelectorAll("button,input").forEach(function(b){b.disabled=true});$("notice").textContent="正在保存安全备份并恢复…";post("restore",{index:item.originalIndex,revision:data.revision})}};action.appendChild(button);tr.appendChild(time);tr.appendChild(name);tr.appendChild(size);tr.appendChild(action);rows.appendChild(tr)});$("notice").textContent=data.notice||"";$("notice").className="notice"+(data.noticeIsError?" error":"")}
window.autolinkerApplyBackupRestore=function(data){currentData=data||{};render(currentData)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentKind=Number(b.dataset.kind);render(currentData)});
$("options").onsubmit=function(e){e.preventDefault();if(!this.reportValidity())return;post("save",{kind:currentKind,enabled:$("enabled").checked,keepCount:Number($("keep").value),intervalMinutes:Number($("interval").value)})};
$("refresh").onclick=function(){post("refresh")};document.addEventListener("DOMContentLoaded",function(){post("ready")});
</script></body></html>
