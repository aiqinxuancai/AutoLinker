<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:"Microsoft YaHei UI","Segoe UI",Arial,sans-serif;color:#20252b;background:#fff;font-size:13px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:auto;background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}button,input{font:inherit}.page{min-height:100%}.page-header{padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff}.page-header-inner{display:flex;min-height:46px;align-items:center;justify-content:space-between;gap:12px}.page-heading{min-width:0}.page-title{overflow:hidden;margin:0;color:#020617;font-size:18px;font-weight:600;line-height:24px;text-overflow:ellipsis;white-space:nowrap}.page-subtitle{overflow:hidden;min-height:20px;margin:2px 0 0;color:#64748b;font-size:12px;line-height:20px;text-overflow:ellipsis;white-space:nowrap}.badge{flex:none;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;padding:4px 8px;border-radius:4px;font-size:12px;line-height:18px}.settings{max-width:940px;padding:0 20px}.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px;padding:25px 0;border-bottom:1px solid #e7eaee}.setting:last-child{border-bottom:0}.setting-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650;color:#22272d}.experimental{border:1px solid #d6b35f;background:#fff9e9;color:#775a17;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:500}.description{margin:8px 0 0;max-width:720px;color:#69737e;line-height:1.7}.status{margin-top:9px;color:#53606c;font-size:12px;line-height:1.55}.status.positive{color:#18704b}.status.warning{color:#8a5d00}.toggle{position:relative;width:42px;height:24px;flex:none}.toggle input{position:absolute;opacity:0;pointer-events:none}.track{display:block;width:42px;height:24px;border:1px solid #b8c0c9;border-radius:12px;background:#dfe3e7;cursor:pointer;transition:.15s}.track:after{content:"";display:block;width:18px;height:18px;margin:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:.15s}.toggle input:checked+.track{border-color:#236aa5;background:#2878b7}.toggle input:checked+.track:after{transform:translateX(18px)}.toggle input:disabled+.track{cursor:not-allowed;opacity:.48}.notice{display:none;margin:20px 20px 0;border-left:3px solid #2c78b5;background:#f4f8fb;padding:11px 13px;color:#44525f;line-height:1.6}.notice.show{display:block}.notice.error{border-left-color:#b33b3b;background:#fff5f5;color:#7b2d2d}@media(max-width:700px){.setting{gap:18px}.badge{display:none}}
</style>
</head>
<body>
<main class="page">
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-heading">
        <h1 class="page-title">日志优化</h1>
        <p class="page-subtitle">集中管理日志查看、编译阶段内部日志捕获和调试输出快速路径。</p>
      </div>
      <span class="badge">本地设置</span>
    </div>
  </header>

  <section class="settings" aria-label="日志优化设置">
    <div class="setting">
      <div>
        <div class="setting-title">日志中心</div>
        <p class="description">打开后覆盖 IDE 原生日志控件（ID 1011），关闭时恢复原控件。打开状态会在本机持久化。</p>
        <div id="logCenterStatus" class="status"></div>
      </div>
      <label class="toggle" title="日志中心">
        <input id="logCenterToggle" type="checkbox">
        <span class="track"></span>
      </label>
    </div>

    <div class="setting">
      <div>
        <div class="setting-title">编译阶段内部日志 Hook</div>
        <p class="description">为编译日志捕获和调试输出优化提供内部输出入口。关闭时，下次启动不扫描地址、不附加 Detour。</p>
        <div id="hookStatus" class="status"></div>
      </div>
      <label class="toggle" title="编译阶段内部日志 Hook">
        <input id="compileHookToggle" type="checkbox">
        <span class="track"></span>
      </label>
    </div>

    <div class="setting">
      <div>
        <div class="setting-title">调试输出效率优化 <span class="experimental">试验</span></div>
        <p class="description">开启后输出调试文本等调试输出函数的性能大幅提升，减少调试与界面更新在同一线程造成的延时。</p>
        <div id="debugStatus" class="status"></div>
      </div>
      <label class="toggle" title="调试输出效率优化">
        <input id="debugToggle" type="checkbox">
        <span class="track"></span>
      </label>
    </div>
  </section>

  <div id="notice" class="notice" role="status"></div>
</main>
<script>
function $(id){return document.getElementById(id)}
function post(action,enabled){if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage(JSON.stringify({action:action,enabled:enabled}))}}
function setNotice(text,isError){var el=$("notice");el.textContent=text||"";el.className="notice"+(text?" show":"")+(isError?" error":"")}
window.autolinkerApplyLogOptimization=function(payload){
  var data=payload||{};
  $("logCenterToggle").checked=!!data.logCenterOpen;
  $("compileHookToggle").checked=!!data.compileHookEnabled;
  $("debugToggle").checked=!!data.debugOptimizationEnabled;
  $("debugToggle").disabled=!data.compileHookEnabled;
  $("logCenterStatus").textContent=data.logCenterOpen?"当前已打开":"当前已关闭";
  $("logCenterStatus").className="status "+(data.logCenterOpen?"positive":"");
  $("hookStatus").textContent=data.hookStatus||"";
  $("hookStatus").className="status "+(data.hookAvailable?"positive":(data.compileHookEnabled?"warning":""));
  $("debugStatus").textContent=data.debugStatus||"";
  $("debugStatus").className="status "+(data.debugOptimizationEnabled?"positive":(!data.compileHookEnabled?"warning":""));
  setNotice(data.notice||"",!!data.noticeIsError);
};
$("logCenterToggle").addEventListener("change",function(){post("set_log_center",this.checked)});
$("compileHookToggle").addEventListener("change",function(){post("set_compile_hook",this.checked)});
$("debugToggle").addEventListener("change",function(){post("set_debug_optimization",this.checked)});
document.addEventListener("DOMContentLoaded",function(){post("ready",false)});
</script>
</body>
</html>
