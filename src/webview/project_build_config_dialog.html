<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei UI",sans-serif;color:#202124;background:#fff;font-size:14px;letter-spacing:0}.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh}.sidebar{border-right:1px solid #dadce0;background:#f7f8fa;padding:18px 12px;overflow:auto}.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}.sidebar h2{font-size:15px;margin:0}.icon-btn{width:30px;height:30px;border:1px solid #c8ccd2;background:#fff;font-size:20px;line-height:26px;cursor:pointer}.config-item{width:100%;height:36px;border:0;background:transparent;text-align:left;padding:0 10px;margin:2px 0;cursor:pointer;color:#34373b}.config-item.active{background:#e7f0fe;color:#174ea6;border-left:3px solid #1a73e8}.main{padding:22px 26px;overflow:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #e2e4e8;padding-bottom:15px;margin-bottom:18px}.top h1{font-size:20px;margin:0 0 5px}.path{color:#68707a;font-size:12px;word-break:break-all}.actions{display:flex;gap:8px}.btn{height:34px;padding:0 15px;border:1px solid #bdc3ca;background:#fff;cursor:pointer}.btn.primary{background:#1769aa;color:#fff;border-color:#1769aa}.btn.danger{color:#b3261e}.form{display:grid;grid-template-columns:170px minmax(0,1fr);gap:15px 18px;max-width:900px}.label{padding-top:9px;font-weight:600}.control{min-width:0}.input,.select,.textarea{width:100%;border:1px solid #bdc3ca;padding:8px 10px;font:inherit;background:#fff}.input,.select{height:36px}.textarea{min-height:100px;resize:vertical;font-family:Consolas,monospace;line-height:1.5}.hint{font-size:12px;color:#68707a;margin-top:5px}.resolved-path{font:12px/1.5 Consolas,"Microsoft YaHei UI",sans-serif;color:#174ea6;margin-top:5px;overflow-wrap:anywhere}.resolved-path.error{color:#b3261e}.switch{display:flex;align-items:center;height:36px;gap:9px}.switch input{width:18px;height:18px}.notice{min-height:22px;margin-top:16px;color:#1769aa}.notice.error{color:#b3261e}.empty{padding:60px 20px;text-align:center;color:#68707a}@media(max-width:760px){.app{grid-template-columns:180px minmax(0,1fr)}.form{grid-template-columns:1fr}.label{padding-top:0}.top{display:block}.actions{margin-top:12px;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar"><div class="sidebar-head"><h2>编译配置</h2><button class="icon-btn" id="addBtn" title="新建配置">+</button></div><div id="list"></div></aside>
 <main class="main"><div id="editor"></div></main>
</div>
<script>
let state={sourcePath:'',configPath:'',variables:{},activeConfiguration:'',configurations:[]};let selected=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=s=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function readEditor(){const c=state.configurations[selected];if(!c)return;c.name=document.getElementById('name').value.trim();c.target=document.getElementById('target').value;c.staticCompile=document.getElementById('static').checked;c.outputPath=document.getElementById('output').value.trim();c.preBuildCommands=lines(document.getElementById('pre').value);c.postBuildCommands=lines(document.getElementById('post').value);state.activeConfiguration=c.name}
 function normalizeWindowsPath(value){let path=String(value||'').replace(/\//g,'\\');let root='',rest=path;if(/^[A-Za-z]:\\/.test(path)){root=path.slice(0,3);rest=path.slice(3)}else if(path.startsWith('\\\\')){const parts=path.slice(2).split('\\');if(parts.length>=2){root='\\\\'+parts.shift()+'\\'+parts.shift()+'\\';rest=parts.join('\\')}}const clean=[];for(const part of rest.split('\\')){if(!part||part==='.')continue;if(part==='..'){if(clean.length)clean.pop();continue}clean.push(part)}return root+clean.join('\\')}
 function resolveOutputPath(template){const vars=state.variables||{};const names={ProgramDir:'programDir',ProjectDir:'projectDir',ProjectName:'projectName',SourcePath:'sourcePath'};const unknown=[];let value=String(template||'').replace(/\{([^{}]+)\}/g,(all,name)=>{const key=names[name];if(!key||!vars[key]){unknown.push(all);return all}return vars[key]});if(unknown.length)return{ok:false,text:'无法解析变量：'+[...new Set(unknown)].join(' ')};if(!/^[A-Za-z]:[\\/]/.test(value)&&!value.startsWith('\\\\'))value=String(vars.projectDir||'')+'\\'+value;return{ok:!!value,text:normalizeWindowsPath(value)}}
 function updateResolvedOutput(){const node=document.getElementById('resolvedOutput'),input=document.getElementById('output');if(!node||!input)return;const result=resolveOutputPath(input.value.trim());node.textContent=result.ok?'实际路径：'+result.text:result.text;node.className='resolved-path'+(result.ok?'':' error')}
 function render(){const list=document.getElementById('list');list.innerHTML=state.configurations.map((c,i)=>`<button class="config-item ${i===selected?'active':''}" data-i="${i}">${esc(c.name)}</button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{readEditor();selected=Number(b.dataset.i);render()});const c=state.configurations[selected];document.getElementById('editor').innerHTML=!c?'<div class="empty">请新建一个编译配置</div>':`<div class="top"><div><h1>${esc(c.name)}</h1><div class="path">${esc(state.sourcePath)}<br>${esc(state.configPath)}</div></div><div class="actions"><button class="btn" id="copy">复制</button><button class="btn danger" id="remove">删除</button><button class="btn primary" id="save">保存</button></div></div><div class="form"><div class="label">配置名称</div><div class="control"><input class="input" id="name" value="${esc(c.name)}"></div><div class="label">编译目标</div><div class="control"><select class="select" id="target"><option value="auto">自动识别</option><option value="win_exe">Windows 窗口程序</option><option value="win_console_exe">Windows 控制台程序</option><option value="win_dll">Windows 动态链接库</option><option value="ecom">易语言模块</option></select></div><div class="label">编译模式</div><label class="switch"><input id="static" type="checkbox">使用静态编译</label><div class="label">输出路径</div><div class="control"><input class="input" id="output" value="${esc(c.outputPath)}"><div class="resolved-path" id="resolvedOutput"></div><div class="hint">可用变量：{ProgramDir} {ProjectDir} {ProjectName} {SourcePath}</div></div><div class="label">编译前动作</div><div class="control"><textarea class="textarea" id="pre" spellcheck="false">${esc((c.preBuildCommands||[]).join('\n'))}</textarea><div class="hint">每行一条 PowerShell 命令；任一命令失败将停止编译。</div></div><div class="label">编译完成后动作</div><div class="control"><textarea class="textarea" id="post" spellcheck="false">${esc((c.postBuildCommands||[]).join('\n'))}</textarea><div class="hint">仅在编译成功后执行；任一命令失败将报告整套流程失败。</div></div></div><div class="notice" id="notice"></div>`;if(!c)return;document.getElementById('target').value=c.target||'auto';document.getElementById('static').checked=!!c.staticCompile;document.getElementById('output').oninput=updateResolvedOutput;updateResolvedOutput();document.getElementById('save').onclick=save;document.getElementById('copy').onclick=copyConfig;document.getElementById('remove').onclick=removeConfig}
function unique(base){let n=base,i=2;while(state.configurations.some(c=>c.name.toLowerCase()===n.toLowerCase()))n=base+' '+i++;return n}
function addConfig(){readEditor();state.configurations.push({name:unique('新配置'),target:'auto',staticCompile:false,outputPath:'{ProjectDir}\\build\\{ProjectName}.exe',preBuildCommands:["Write-Output '开始编译：{ProjectName}'"],postBuildCommands:["Write-Output '编译完成：{OutputPath}'"]});selected=state.configurations.length-1;render()}
function copyConfig(){readEditor();const c=structuredClone(state.configurations[selected]);c.name=unique(c.name+' 副本');state.configurations.push(c);selected=state.configurations.length-1;render()}
 function removeConfig(){if(!confirm('确定删除此配置吗？'))return;state.configurations.splice(selected,1);selected=Math.min(selected,state.configurations.length-1);if(!state.configurations.length){state.activeConfiguration='';render();chrome.webview.postMessage(JSON.stringify({action:'save',data:state}));return}render()}
 function save(){readEditor();const c=state.configurations[selected];if(!c){chrome.webview.postMessage(JSON.stringify({action:'save',data:state}));return}if(!c.name||!c.outputPath){show('配置名称和输出路径不能为空。',true);return}if(state.configurations.some((x,i)=>i!==selected&&x.name.toLowerCase()===c.name.toLowerCase())){show('配置名称不能重复。',true);return}chrome.webview.postMessage(JSON.stringify({action:'save',data:state}))}
function show(message,error){const n=document.getElementById('notice');if(n){n.textContent=message||'';n.className='notice'+(error?' error':'')}}
window.autolinkerProjectBuildSaveResult=function(result){if(result.data){state=result.data;const i=state.configurations.findIndex(c=>c.name===state.activeConfiguration);selected=i>=0?i:0;render()}show(result.message,!result.ok)};
document.getElementById('addBtn').onclick=addConfig;chrome.webview.postMessage(JSON.stringify({action:'ready'}));
</script>
</body>
</html>
